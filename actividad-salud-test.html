const BANK=[{"id":"S1","topic":"Tema 1","q":"¿Cómo definen los apuntes la actividad física?","options":["Actividad competitiva sujeta a reglas","Actividad que supone gasto energético adicional al necesario para mantenerse con vida","Solo ejercicio de alta intensidad","Cualquier actividad realizada en un gimnasio"],"correct":[1],"explanation":"La actividad física se define como actividad que supone un gasto energético adicional al necesario para mantenerse con vida.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S2","topic":"Tema 1","q":"¿Cómo se define el ejercicio?","options":["Actividad física diseñada y planificada para mantener o mejorar la forma física","Cualquier movimiento involuntario","Solo deporte competitivo","Reposo activo"],"correct":[0],"explanation":"Los apuntes definen ejercicio como actividad física diseñada y planificada con el fin de mantener o mejorar la forma física y la salud.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S3","topic":"Tema 1","q":"¿Qué caracteriza al deporte?","options":["No tiene reglas","Es ejercicio físico sujeto a reglas y competición","Siempre es individual","No implica ejercicio"],"correct":[1],"explanation":"El deporte se define como ejercicio físico sujeto a reglas y que tiene competición.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S4","topic":"Tema 1","q":"¿Qué significa la F del marco FITT?","options":["Fuerza","Frecuencia","Fatiga","Flexibilidad"],"correct":[1],"explanation":"FITT: frecuencia, intensidad, tiempo y tipo.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S5","topic":"Tema 1","q":"¿Qué significa la I de FITT?","options":["Intensidad","Intervalo","Inactividad","Índice"],"correct":[0],"explanation":"FITT: frecuencia, intensidad, tiempo y tipo.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S6","topic":"Tema 1","q":"¿Qué significa la primera T de FITT?","options":["Técnica","Tiempo o duración","Tensión","Trabajo"],"correct":[1],"explanation":"En FITT, una T corresponde al tiempo o duración.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S7","topic":"Tema 1","q":"¿Qué significa la segunda T de FITT?","options":["Tipo o modo","Tensión","Talla","Temperatura"],"correct":[0],"explanation":"En FITT, la otra T corresponde al tipo o modo.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S8","topic":"Tema 1","q":"¿Cuántas horas de sueño diarias se recomiendan a adultos según estos apuntes?","options":["4-5","5-6","7-9","11-13"],"correct":[2],"explanation":"Los apuntes recogen 7-9 horas/día para adultos.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S9","topic":"Tema 1","q":"¿Cuántas horas de sueño se recomiendan a adolescentes?","options":["5-6","7-8","9-11","12-14"],"correct":[2],"explanation":"Los apuntes recogen 9-11 horas/día para adolescentes.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S10","topic":"Tema 1","q":"¿Qué se asocia a un comportamiento sedentario superior a 3 horas al día?","options":["Menor riesgo cardiovascular","Aumento del riesgo de mortalidad por enfermedad cardiovascular","Ausencia de riesgo","Solo mejora del sueño"],"correct":[1],"explanation":"Los apuntes relacionan >3 h/día de comportamiento sedentario con mayor riesgo de mortalidad cardiovascular.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S11","topic":"Tema 1","q":"¿Qué modelo ayuda a entender cómo cambia una persona su conducta?","options":["Modelo de Borg","Modelo transteórico de Prochaska y Diclemente","Modelo de Tanner","Modelo de Cori"],"correct":[1],"explanation":"El modelo transteórico de los estados de cambio representa la evolución temporal del proceso de cambio de conducta.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S12","topic":"Tema 1","q":"En precontemplación, la persona…","options":["Hace ejercicio desde hace más de 6 meses","No hace ejercicio y no tiene interés","Hace ejercicio ocasionalmente","Quiere competir"],"correct":[1],"explanation":"Precontemplación: no hace ejercicio y no tiene interés.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S13","topic":"Tema 1","q":"En contemplación, la persona…","options":["No hace ejercicio pero quiere hacerlo","Hace ejercicio regularmente","No tiene interés","Compite semanalmente"],"correct":[0],"explanation":"Contemplación: no hace ejercicio, pero quiere hacerlo.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S14","topic":"Tema 1","q":"En preparación, la persona…","options":["No hace nunca ejercicio","Hace ejercicio de vez en cuando","Lleva más de 6 meses entrenando","Solo hace competición"],"correct":[1],"explanation":"Preparación: hace ejercicio de vez en cuando.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S15","topic":"Tema 1","q":"En acción, la persona hace ejercicio regularmente desde…","options":["Más de 5 años","Menos de 6 meses","Más de 6 meses","Exactamente 1 año"],"correct":[1],"explanation":"Acción: ejercicio regular desde hace menos de 6 meses.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S16","topic":"Tema 1","q":"En mantenimiento, la persona hace ejercicio regularmente desde…","options":["Más de 6 meses","Menos de 1 mes","Menos de 6 meses","Nunca"],"correct":[0],"explanation":"Mantenimiento: ejercicio regular desde hace más de 6 meses.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S17","topic":"Tema 1","q":"¿Qué porcentaje de los determinantes de salud atribuyen los apuntes al medio ambiente y estilo de vida?","options":["10%","30%","60%","90%"],"correct":[2],"explanation":"Los apuntes indican genética 30%, medio ambiente y estilo de vida 60% y atención médica 10%.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S18","topic":"Tema 1","q":"¿Qué porcentaje se atribuye a la genética?","options":["10%","30%","60%","80%"],"correct":[1],"explanation":"Los apuntes atribuyen un 30% a la genética.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S19","topic":"Tema 1","q":"¿Qué porcentaje se atribuye a la atención médica?","options":["10%","30%","60%","70%"],"correct":[0],"explanation":"Los apuntes atribuyen un 10% a la atención médica.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S20","topic":"Tema 1","q":"¿Quién creó la iniciativa Exercise is Medicine según los apuntes?","options":["OMS únicamente","ACSM y Asociación Médica Estadounidense","COI únicamente","Ministerio de Educación"],"correct":[1],"explanation":"Se describe como una iniciativa creada por el ACSM y la Asociación Médica Estadounidense.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S21","topic":"Tema 1","q":"¿Cuál es el objetivo principal de Exercise is Medicine?","options":["Eliminar el ejercicio del tratamiento","Informar y educar a médicos y otros proveedores sobre el ejercicio","Promover solo deporte profesional","Sustituir toda medicación"],"correct":[1],"explanation":"Su objetivo es informar y educar a profesionales sanitarios sobre el ejercicio.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S22","topic":"Tema 1","q":"¿Qué es EXERNET según los apuntes?","options":["Una escala de esfuerzo","La primera red de investigación en España relacionada con actividad física y salud","Un fármaco","Un test de fuerza"],"correct":[1],"explanation":"EXERNET se presenta como la primera red española de investigación relacionada con actividad física y salud.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S23","topic":"Tema 1","q":"En las enfermedades no transmisibles, el ejercicio se relaciona con…","options":["Solo diagnóstico","Prevención, tratamiento y pronóstico","Solo cirugía","Ningún efecto"],"correct":[1],"explanation":"Los apuntes señalan prevención, tratamiento y pronóstico.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S24","topic":"Tema 1","q":"¿Qué persigue el CERT?","options":["Medir la talla","Especificar la dosis de ejercicio en ensayos clínicos aleatorios","Diagnosticar osteoporosis","Clasificar deportes"],"correct":[1],"explanation":"CERT se describe como una checklist para especificar la dosis de las intervenciones de ejercicio.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"S25","topic":"Tema 3","q":"¿Cuál es la meta del Plan de Acción Mundial sobre Actividad Física 2020-2030 indicada en los apuntes?","options":["Reducir 5% la inactividad","Reducir 15% la prevalencia mundial de inactividad física en adultos y adolescentes para 2030","Eliminar toda inactividad en 2025","Aumentar 15% el sedentarismo"],"correct":[1],"explanation":"La meta recogida es una reducción relativa del 15% de la prevalencia mundial de inactividad física para 2030.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S26","topic":"Tema 3","q":"¿Cuál es uno de los objetivos del Plan de Acción Mundial?","options":["Crear una sociedad activa","Reducir espacios públicos","Eliminar educación física","Desincentivar caminar"],"correct":[0],"explanation":"Entre los objetivos aparece crear una sociedad activa.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S27","topic":"Tema 3","q":"¿Qué medida forma parte de 'crear entornos activos'?","options":["Empeorar redes peatonales","Mejorar redes para desplazamientos a pie y en bicicleta","Reducir seguridad vial","Cerrar espacios públicos"],"correct":[1],"explanation":"Los apuntes incluyen mejorar redes para desplazamientos a pie y en bicicleta.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S28","topic":"Tema 3","q":"¿Qué se propone para fomentar poblaciones activas?","options":["Eliminar programas escolares","Mejorar la educación física y programas escolares","Reducir servicios de salud","Evitar iniciativas comunitarias"],"correct":[1],"explanation":"El plan incluye mejorar la educación física y los programas escolares.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S29","topic":"Tema 3","q":"¿Qué caracteriza la actividad física en primera infancia según los apuntes?","options":["Debe basarse en el juego","Debe centrarse en competición","Debe ser solo vigorosa","Debe excluir interacción social"],"correct":[0],"explanation":"Los apuntes indican que la actividad física debe estar basada en el juego.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S30","topic":"Tema 3","q":"¿Qué intensidad corresponde a menos de 3 MET en niños?","options":["Ligera","Moderada","Vigorosa","Máxima"],"correct":[0],"explanation":"Los apuntes clasifican la intensidad ligera como <3 MET.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S31","topic":"Tema 3","q":"¿Qué intensidad corresponde a 3-6 MET?","options":["Ligera","Moderada","Vigorosa","Máxima"],"correct":[1],"explanation":"La intensidad moderada se sitúa entre 3 y 6 MET.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S32","topic":"Tema 3","q":"¿Qué intensidad corresponde a más de 6 MET?","options":["Ligera","Moderada","Vigorosa","Reposo"],"correct":[2],"explanation":"La intensidad vigorosa se define como >6 MET.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S33","topic":"Tema 3","q":"En niños de 3-6 años, ¿qué beneficio se recoge?","options":["Empeora salud ósea","Mejora del control del peso corporal","Aumenta síntomas depresivos","Reduce coordinación"],"correct":[1],"explanation":"Para 3-6 años se recoge mejora del control del peso y de la salud ósea.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S34","topic":"Tema 3","q":"En niños y adolescentes de 6-17 años, ¿qué beneficio se recoge?","options":["Peor función cognitiva","Mejora de la función cognitiva","Peor condición cardiorrespiratoria","Mayor adiposidad"],"correct":[1],"explanation":"Entre los beneficios de 6-17 años aparece la mejora de la función cognitiva.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S35","topic":"Tema 3","q":"¿Qué otra razón se da para promover actividad física en niños?","options":["Evitar hábitos de ejercicio","Crear hábitos para adolescencia y resto de la vida","Reducir relaciones interpersonales","Evitar contacto con naturaleza"],"correct":[1],"explanation":"Los apuntes destacan crear hábitos para la adolescencia y el resto de la vida.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"S36","topic":"Tema 4","q":"¿Qué es la etiología?","options":["La rehabilitación de una enfermedad","La causa o conjunto de causas que originan una enfermedad","Una escala de esfuerzo","Un tipo de entrenamiento"],"correct":[1],"explanation":"Etiología es la causa o conjunto de causas que originan una enfermedad.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S37","topic":"Tema 4","q":"¿Qué estudia la fisiopatología?","options":["Solo el rendimiento deportivo","Los mecanismos generadores de alteración funcional que apartan de la homeostasis","Solo nutrición","La técnica deportiva"],"correct":[1],"explanation":"Los apuntes la definen como la ciencia/rama que estudia los mecanismos patogénicos y de alteración funcional.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S38","topic":"Tema 4","q":"¿Cuál es una enfermedad endocrina crónica mencionada?","options":["Diabetes","Esguince","Gripe","Miopía"],"correct":[0],"explanation":"Entre las enfermedades endocrinas aparecen diabetes, obesidad y síndrome metabólico.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S39","topic":"Tema 4","q":"¿Cuál es una enfermedad ósea crónica mencionada?","options":["Osteoporosis","Migraña","Asma","Dermatitis"],"correct":[0],"explanation":"La osteoporosis aparece como enfermedad crónica ósea.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S40","topic":"Tema 4","q":"¿Cuál es una enfermedad muscular crónica mencionada?","options":["Sarcopenia","Rinitis","Catarata","Otitis"],"correct":[0],"explanation":"La sarcopenia aparece en la categoría muscular.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S41","topic":"Tema 4","q":"¿Qué busca la prevención primaria?","options":["Rehabilitar secuelas","Evitar la aparición de la enfermedad controlando factores causales y predisponentes","Tratar solo complicaciones","Reinsertar laboralmente"],"correct":[1],"explanation":"La prevención primaria se orienta a evitar la aparición de la enfermedad.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S42","topic":"Tema 4","q":"¿Qué busca la prevención secundaria?","options":["Identificación temprana y tratamiento para limitar progresión y complicaciones","Solo vacunación","Solo rehabilitación social","Ningún tratamiento"],"correct":[0],"explanation":"La prevención secundaria implica identificación temprana e instauración de tratamiento efectivo.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S43","topic":"Tema 4","q":"¿Qué busca la prevención terciaria?","options":["Evitar cualquier diagnóstico","Recuperación y rehabilitación física, psicológica y social","Solo detección precoz","Solo vacunación"],"correct":[1],"explanation":"La prevención terciaria se centra en recuperación, rehabilitación y mejora de calidad de vida.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S44","topic":"Tema 4","q":"¿Qué ejemplo corresponde a prevención terciaria?","options":["Rehabilitación cardíaca tras un infarto","Vacunación","Campaña escolar preventiva","Cribado sin enfermedad"],"correct":[0],"explanation":"La rehabilitación cardíaca tras un infarto se presenta como ejemplo de prevención terciaria.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S45","topic":"Tema 4","q":"¿Cuál es el objetivo principal de la CIF?","options":["Clasificar deportes","Proporcionar lenguaje unificado y marco conceptual para describir salud y estados relacionados","Medir VO2 máximo","Prescribir fármacos"],"correct":[1],"explanation":"La CIF busca un lenguaje unificado y estandarizado para describir funcionamiento, salud y restricciones.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S46","topic":"Tema 4","q":"En patología crónica, el ejercicio debe utilizarse principalmente cuando el paciente está…","options":["Clínicamente inestable","Clínicamente estable","Siempre hospitalizado","En ayuno"],"correct":[1],"explanation":"Entre los principios generales aparece utilizar ejercicio en el paciente clínicamente estable.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S47","topic":"Tema 4","q":"¿Qué forma de actividad física se propone como predeterminada para quien pueda realizarla?","options":["Esprint","Caminar","Powerlifting","Natación competitiva"],"correct":[1],"explanation":"El Tema 4 destaca caminar como forma predeterminada de actividad física para cualquiera que pueda andar.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S48","topic":"Tema 4","q":"¿Cuál es una ventaja de caminar?","options":["Requiere equipamiento especializado","Es caro","Es accesible y barato","Tiene mala adherencia"],"correct":[2],"explanation":"Caminar se describe como accesible, barato y con buena adherencia a largo plazo.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S49","topic":"Tema 4","q":"En la receta deportiva, ¿qué significa frecuencia?","options":["Duración diaria","Número de días por semana","Naturaleza de la actividad","Nivel de esfuerzo"],"correct":[1],"explanation":"Frecuencia indica con qué frecuencia se realiza la actividad, expresada en días por semana.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S50","topic":"Tema 4","q":"En la receta deportiva, ¿qué significa intensidad?","options":["Número de días","Nivel de esfuerzo percibido o cuantificado","Tipo de actividad","Duración total"],"correct":[1],"explanation":"Intensidad es el nivel de esfuerzo percibido subjetivamente u objetivamente cuantificado.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S51","topic":"Tema 4","q":"En la receta deportiva, ¿qué significa tiempo?","options":["Duración de cada actividad cada día","Número de días por semana","Tipo de fármaco","Diagnóstico"],"correct":[0],"explanation":"Tiempo se refiere a la duración de cada actividad cada día.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S52","topic":"Tema 4","q":"En la receta deportiva, ¿qué significa tipo?","options":["Nivel de esfuerzo","Naturaleza específica de la actividad","Frecuencia semanal","Frecuencia cardiaca"],"correct":[1],"explanation":"Tipo es la naturaleza específica de la actividad o actividades.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S53","topic":"Tema 4","q":"¿Cuál es el primer paso de la programación del ejercicio clínico?","options":["Evaluar el estado de salud actual","Elegir un gimnasio","Comprar un reloj","Hacer un test máximo siempre"],"correct":[0],"explanation":"El paso 1 es evaluar el estado de salud actual.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S54","topic":"Tema 4","q":"¿Qué debe conocerse al evaluar la actividad física actual de un paciente con enfermedad?","options":["Solo su edad","Si la enfermedad está controlada, fármacos y severidad","Solo su peso","Solo su profesión"],"correct":[1],"explanation":"Los apuntes incluyen control de enfermedad, fármacos y severidad para marcar objetivos.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"S55","topic":"Tema 4","q":"¿Qué diferencia hay entre nombre genérico y comercial de un medicamento?","options":["Son siempre idénticos","El genérico identifica el medicamento independientemente del fabricante; el comercial lo da la empresa","El comercial es el principio activo","No existe diferencia"],"correct":[1],"explanation":"El Tema 4 diferencia el nombre genérico del nombre comercial otorgado por la empresa.","source":"Apuntes de Actividad Física y Salud · Tema 4"}],SIZE=20,KEY="upm_actividad_física_y_salud_v1";
let saved=JSON.parse(localStorage.getItem(KEY)||'{"block":0,"fails":[],"favs":[]}'), pool=[],idx=0,answers={},kind="normal",finished=false;
const $=s=>document.querySelector(s),qid=q=>q.id,save=()=>localStorage.setItem(KEY,JSON.stringify(saved));
function blocks(){return Math.ceil(BANK.length/SIZE)} function fill(){$("#block").innerHTML=Array.from({length:blocks()},(_,i)=>`<option value="${i}">Bloque ${i+1} · ${i*SIZE+1}-${Math.min((i+1)*SIZE,BANK.length)}</option>`).join("");$("#block").value=Math.min(saved.block,blocks()-1)}
function build(k="normal"){kind=k;idx=0;answers={};finished=false;if(k==="fails")pool=BANK.filter(q=>saved.fails.includes(q.id));else if(k==="favs")pool=BANK.filter(q=>saved.favs.includes(q.id));else{saved.block=+$("#block").value;save();pool=BANK.slice(saved.block*SIZE,(saved.block+1)*SIZE)}render()}
function grade(q,sel){let good=q.correct.length===sel.length&&q.correct.every(x=>sel.includes(x)); if(good)saved.fails=saved.fails.filter(x=>x!==q.id);else if(!saved.fails.includes(q.id))saved.fails.push(q.id);save();return good}
function render(){
 if(finished)return result();
 if(!pool.length){$("#app").innerHTML='<div class="card">No hay preguntas guardadas en esta sección.</div>';return}
 let q=pool[idx],a=answers[q.id],exam=$("#mode").value==="exam",last=idx===pool.length-1;
 $("#app").innerHTML=`<div class="card"><div class="meta"><span class="pill">${kind==="normal"?`Bloque ${saved.block+1} de ${blocks()}`:kind==="fails"?"Repaso de fallos":"Favoritas"}</span><span class="pill">${q.topic}</span><span class="stats">Pregunta ${idx+1} de ${pool.length}</span></div><div class="q">${q.q}</div><div id="opts">${q.options.map((o,i)=>`<button class="opt ${a?.sel?.includes(i)?"sel":""}" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>
 <button class="btn" id="star">${saved.favs.includes(q.id)?"★ Quitar favorita":"☆ Añadir favorita"}</button><button class="btn" id="check" ${a?.graded?"disabled":""}>${exam?"Guardar respuesta":"Comprobar"}</button>
 <div id="fb">${a?.graded&&!exam?`<div class="feedback"><b>${a.good?"✓ Correcta":"✗ Incorrecta"}</b><br>${q.explanation}<br><span class="muted">${q.source}</span></div>`:""}</div>
 <div class="nav"><button class="btn" id="prev" ${idx===0?"disabled":""}>← Anterior</button><button class="btn" id="next">${last?"Finalizar bloque":"Siguiente →"}</button></div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(answers[q.id]?.graded)return;answers[q.id]={sel:[+b.dataset.i],graded:false};render()});
 $("#star").onclick=()=>{let p=saved.favs.indexOf(q.id);p>=0?saved.favs.splice(p,1):saved.favs.push(q.id);save();render()};
 $("#check").onclick=()=>{let a=answers[q.id];if(!a?.sel?.length)return alert("Selecciona una respuesta.");a.graded=true;a.good=grade(q,a.sel);answers[q.id]=a;render()};
 $("#prev").onclick=()=>{if(idx>0){idx--;render()}};$("#next").onclick=()=>{if(!answers[q.id]?.graded)return alert("Primero responde la pregunta.");if(last){finished=true;render()}else{idx++;render()}};
}
function result(){let g=Object.values(answers).filter(a=>a.good).length,n=pool.length,note=(g/Math.max(n,1)*10).toFixed(1),last=saved.block>=blocks()-1;
 $("#app").innerHTML=`<div class="card" style="text-align:center"><div class="muted">BLOQUE FINALIZADO</div><div class="big">${note}/10</div><h2>${g} aciertos de ${n}</h2><div class="nav" style="justify-content:center"><button class="btn" id="repeat">Repetir bloque</button>${kind==="normal"&&!last?'<button class="btn" id="nextb">Siguiente bloque de 20 →</button>':""}</div></div>`;
 $("#repeat").onclick=()=>build(kind);let nb=$("#nextb");if(nb)nb.onclick=()=>{saved.block++;save();fill();build("normal")}
}
fill();build();$("#block").onchange=()=>build("normal");$("#mode").onchange=()=>build(kind);$("#fails").onclick=()=>build("fails");$("#favs").onclick=()=>build("favs");
</script></body></html>
