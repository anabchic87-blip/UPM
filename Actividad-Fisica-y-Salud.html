function load(custom){let a=custom||baseFilter();if(!custom){let b=+$('block').value||0;a=a.slice(b*20,b*20+20)}filtered=a;current=0;answers={};render()}
function render(){if(!filtered.length){$('q').textContent='No hay preguntas con este filtro.';$('opts').innerHTML='';return}let x=filtered[current],ans=answers[x.n];$('topicname').textContent=x.topic;$('q').textContent=x.q;$('pos').textContent='Pregunta '+(current+1)+' de '+filtered.length+' · nº '+x.n;$('opts').innerHTML='';x.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+') '+o;if(ans!==undefined&&mode==='study'){if(i===x.correct)b.classList.add('correct');if(i===ans&&ans!==x.correct)b.classList.add('wrong')}b.onclick=()=>choose(i);$('opts').appendChild(b)});$('exp').style.display=(ans!==undefined&&mode==='study')?'block':'none';$('exp').innerHTML='<b>Explicación:</b> '+x.exp;$('star').textContent=favorites.has(x.n)?'★ Favorita':'☆ Favorita';$('bar').style.width=((current+1)/filtered.length*100)+'%';let vals=Object.entries(answers),ok=vals.filter(([n,a])=>BANK.find(x=>x.n==n)?.correct===a).length,ko=vals.length-ok;$('ok').textContent=ok;$('ko').textContent=ko;$('pct').textContent=vals.length?Math.round(ok/vals.length*100)+'%':'0%';$('blockinfo').textContent=filtered.length+' preguntas en esta selección';let g=$('grid');g.innerHTML='';filtered.forEach((z,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=(i===current?'now ':'')+(answers[z.n]!==undefined?'done':'');b.onclick=()=>{current=i;render()};g.appendChild(b)})}
function choose(i){let x=filtered[current];if(answers[x.n]!==undefined)return;answers[x.n]=i;if(i!==x.correct)failsSet.add(x.n);render()}
$('next').onclick=()=>{if(current<filtered.length-1){current++;render()}else if(mode==='exam'){mode='study';$('study').classList.add('active');$('exam').classList.remove('active');render();alert('Examen finalizado. Ya puedes revisar respuestas y explicaciones.')}};$('prev').onclick=()=>{if(current>0){current--;render()}};$('study').onclick=()=>{mode='study';$('study').classList.add('active');$('exam').classList.remove('active');render()};$('exam').onclick=()=>{mode='exam';$('exam').classList.add('active');$('study').classList.remove('active');render()};$('topic').onchange=rebuild;$('block').onchange=()=>load();$('search').oninput=rebuild;$('reset').onclick=()=>load();$('star').onclick=()=>{let n=filtered[current].n;favorites.has(n)?favorites.delete(n):favorites.add(n);localStorage.setItem('afs120fav',JSON.stringify([...favorites]));render()};$('fav').onclick=()=>load(BANK.filter(x=>favorites.has(x.n)));$('fails').onclick=()=>load(BANK.filter(x=>failsSet.has(x.n)));rebuild();</script></body></html>
