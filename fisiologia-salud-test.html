<script>
const BANK=[{"id":"F1","topic":"Tema 1","q":"¿A cuánto equivale 1 MET en consumo de oxígeno?","options":["1,5 mL/kg/min","3,5 mL/kg/min","5,0 mL/kg/min","7,0 mL/kg/min"],"correct":[1],"explanation":"Los apuntes definen 1 MET como 3,5 mL/kg/min, correspondiente al gasto energético en reposo.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F2","topic":"Tema 1","q":"¿Cuál de los siguientes es un componente cardiorrespiratorio de la forma física?","options":["Composición corporal","Flexibilidad","Máxima potencia aeróbica","Agilidad"],"correct":[2],"explanation":"Entre los componentes cardiorrespiratorios aparecen la función cardíaca y pulmonar, la máxima potencia aeróbica y la resistencia submáxima.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F3","topic":"Tema 1","q":"¿Cuál es un componente metabólico de la forma física?","options":["Tolerancia a la glucosa","Equilibrio","Fuerza isométrica","Flexibilidad"],"correct":[0],"explanation":"Los apuntes incluyen tolerancia a la glucosa, metabolismo lipídico y oxidación del sustrato como componentes metabólicos.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F4","topic":"Tema 1","q":"¿Qué adaptación cardiovascular se asocia al ejercicio a una intensidad submáxima determinada?","options":["Aumento de la frecuencia cardiaca","Disminución de la frecuencia cardiaca y la presión arterial","Aumento de la ventilación minuto","Disminución de la densidad capilar"],"correct":[1],"explanation":"Los apuntes señalan una disminución de la frecuencia cardiaca y de la presión arterial a una intensidad submáxima determinada.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F5","topic":"Tema 1","q":"¿Qué ocurre con la densidad capilar del músculo esquelético con la actividad física?","options":["Disminuye","No cambia","Aumenta","Desaparece"],"correct":[2],"explanation":"Entre los beneficios fisiológicos se recoge un aumento de la densidad capilar en el músculo esquelético.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F6","topic":"Tema 1","q":"¿Qué ocurre con el umbral para la acumulación de lactato con el entrenamiento?","options":["Disminuye","Aumenta","Desaparece","No se modifica"],"correct":[1],"explanation":"Los apuntes indican un incremento del umbral de ejercicio para la acumulación de lactato en sangre.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F7","topic":"Tema 1","q":"¿Qué efecto tiene la actividad física sobre los requerimientos de insulina?","options":["Los aumenta","Los reduce y mejora la tolerancia a la glucosa","Los elimina por completo","No tiene efecto"],"correct":[1],"explanation":"Se recoge una reducción de los requerimientos de insulina y una mejoría de la tolerancia a la glucosa.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F8","topic":"Tema 1","q":"¿Cuál de estas variables se utiliza como indicador de resistencia?","options":["DEXA","VO2 máx y VT2","Antropometría","Dinamometría"],"correct":[1],"explanation":"En los indicadores de salud, la resistencia se relaciona con VO2 máx y VT2.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F9","topic":"Tema 1","q":"¿Qué prueba se relaciona con la función de la fuerza?","options":["DEXA","Antropometría","Dinamometría","Espirometría"],"correct":[2],"explanation":"Los apuntes diferencian estructura (DEXA/antropometría) y función (dinamometría/biomarcadores).","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F10","topic":"Tema 1","q":"La homeostasis del tejido muscular depende principalmente del equilibrio entre…","options":["Glucosa y lactato","Síntesis y degradación de proteínas","Sodio y agua","Ventilación e intercambio gaseoso"],"correct":[1],"explanation":"Los apuntes describen la regulación de la masa muscular como un equilibrio entre síntesis y degradación de proteínas.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F11","topic":"Tema 1","q":"¿Cuál es un determinante de la fuerza mencionado en los apuntes?","options":["Menor reclutamiento neuromuscular","Mayor reclutamiento neuromuscular","Menor apertura de canales de calcio","Menor número de fibras activas"],"correct":[1],"explanation":"Entre los determinantes de la fuerza aparece un mayor reclutamiento neuromuscular.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F12","topic":"Tema 1","q":"¿Qué mecanismo celular se menciona entre los determinantes de la fuerza?","options":["Cierre de canales de calcio","Aumento de la apertura de canales de calcio","Bloqueo de bombas sodio-potasio","Reducción de fibras activas"],"correct":[1],"explanation":"Los apuntes incluyen el aumento de la apertura de canales de calcio.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F13","topic":"Tema 1","q":"¿Qué variable fisiológica aparece entre las variables relacionadas con Exercise is Medicine?","options":["VO2 pico","Longitud del fémur","Perímetro craneal","Agudeza visual"],"correct":[0],"explanation":"Los apuntes incluyen VO2 pico entre las variables fisiológicas relevantes.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F14","topic":"Tema 1","q":"¿Qué sistemas se valoran mediante variables fisiológicas en el contexto de ejercicio y salud?","options":["Solo digestivo","Función pulmonar y cardiovascular","Solo renal","Solo endocrino"],"correct":[1],"explanation":"Se mencionan específicamente la función pulmonar y cardiovascular.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F15","topic":"Tema 1","q":"¿Qué mecanismo de acción del ejercicio aparece en los apuntes?","options":["Respuesta proinflamatoria","Respuesta antiinflamatoria","Bloqueo mitocondrial","Pérdida de neuroplasticidad"],"correct":[1],"explanation":"Entre los mecanismos de acción se incluye la respuesta antiinflamatoria.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F16","topic":"Tema 1","q":"¿Qué otro mecanismo de acción se atribuye al ejercicio?","options":["Respuesta antioxidante","Aumento del estrés oxidativo como objetivo","Supresión de la inmunidad","Reducción de la flexibilidad metabólica"],"correct":[0],"explanation":"Los apuntes incluyen una respuesta antioxidante entre los mecanismos de acción.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F17","topic":"Tema 1","q":"¿Qué señalización molecular se menciona asociada a los mecanismos del ejercicio?","options":["PGC, Akt y mTOR","TSH y ACTH exclusivamente","ADH y aldosterona","Renina y angiotensina exclusivamente"],"correct":[0],"explanation":"Los apuntes citan PGC, Akt y mTOR entre las vías de señalización molecular.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F18","topic":"Tema 1","q":"¿Qué efecto neurológico se menciona asociado al ejercicio?","options":["Reduce la neuroplasticidad","Estimula el crecimiento neuronal y la neuroplasticidad","Elimina la función cognitiva","No tiene efectos"],"correct":[1],"explanation":"Los apuntes señalan que el ejercicio estimula el crecimiento neuronal y la neuroplasticidad.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F19","topic":"Tema 1","q":"¿Qué capacidad metabólica se menciona como mecanismo/resultado asociado al ejercicio?","options":["Rigidez metabólica","Flexibilidad metabólica","Ausencia de oxidación","Bloqueo lipídico"],"correct":[1],"explanation":"Los apuntes incluyen la flexibilidad metabólica.","source":"Apuntes de Actividad Física y Salud · Tema 1"},{"id":"F20","topic":"Tema 3","q":"Durante el primer año de vida, ¿qué rango de frecuencia cardiaca aparece en los apuntes?","options":["40-60 lpm","60-80 lpm","80-160 lpm","160-220 lpm"],"correct":[2],"explanation":"Los apuntes del Tema 3 sitúan la FC del primer año entre 80 y 160 lpm.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"F21","topic":"Tema 3","q":"Durante el segundo año de vida, ¿qué rango de frecuencia cardiaca aparece?","options":["80-130 lpm","40-60 lpm","140-200 lpm","20-40 lpm"],"correct":[0],"explanation":"En el segundo año se recoge una frecuencia cardiaca de 80-130 lpm.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"F22","topic":"Tema 3","q":"¿Cuál es la presión arterial media indicada para el bebé en los apuntes?","options":["120/80","85/60","160/100","60/20"],"correct":[1],"explanation":"Los apuntes señalan una presión arterial media de 85/60.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"F23","topic":"Tema 3","q":"¿Qué volumen respiratorio aparece para el bebé?","options":["1 L/min","3 L/min","10 L/min","20 L/min"],"correct":[1],"explanation":"El Tema 3 recoge un volumen respiratorio de 3 L/min.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"F24","topic":"Tema 3","q":"¿Hacia qué edad alcanza el filtrado glomerular valores iguales a los del adulto?","options":["6 meses","1 año","2 años","5 años"],"correct":[2],"explanation":"Los apuntes indican que hacia los 2 años el filtrado glomerular alcanza valores iguales a los del adulto.","source":"Apuntes de Actividad Física y Salud · Tema 3"},{"id":"F25","topic":"Tema 4","q":"¿Qué efecto tiene el ejercicio cardiorrespiratorio sobre las mitocondrias?","options":["Reduce la biogénesis","Promueve la biogénesis mitocondrial","Impide la mitofagia","Empeora la homeostasis mitocondrial"],"correct":[1],"explanation":"El Tema 4 indica que el ejercicio cardiorrespiratorio promueve la biogénesis mitocondrial.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F26","topic":"Tema 4","q":"¿Qué proceso de control de calidad mitocondrial activa el ejercicio aeróbico?","options":["Mitofagia","Necrosis obligatoria","Calcificación","Hemólisis"],"correct":[0],"explanation":"Los apuntes señalan que el ejercicio aeróbico activa la mitofagia.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F27","topic":"Tema 4","q":"¿Qué ocurre con la dinámica mitocondrial con el ejercicio cardiorrespiratorio?","options":["Empeora","Mejora su equilibrio","Desaparece","No se menciona"],"correct":[1],"explanation":"El Tema 4 recoge una mejora del equilibrio de la dinámica mitocondrial.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F28","topic":"Tema 4","q":"¿Qué medida se usa para monitorizar la intensidad junto con la FC y la sintomatología ventilatoria?","options":["RPE","IMC exclusivamente","DEXA","Glucemia basal exclusivamente"],"correct":[0],"explanation":"Las medidas de control incluyen sintomatología ventilatoria, frecuencia cardiaca y RPE.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F29","topic":"Tema 4","q":"En actividad moderada, ¿qué característica respiratoria aparece en los apuntes?","options":["No permite hablar","Permite mantener una conversación","No cambia la respiración","Solo puede durar menos de 10 minutos"],"correct":[1],"explanation":"La intensidad moderada permite mantener una conversación.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F30","topic":"Tema 4","q":"En actividad vigorosa, según los apuntes…","options":["La demanda ventilatoria permite hablar con normalidad","No permite mantener la respiración durante el habla","No hay cambios ventilatorios","Debe durar más de 60 minutos"],"correct":[1],"explanation":"La actividad vigorosa se describe como exigente y no permite mantener la respiración durante el habla.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F31","topic":"Tema 4","q":"¿Qué escala se menciona para valorar la percepción de esfuerzo?","options":["Glasgow","Borg","Tanner","Apgar"],"correct":[1],"explanation":"El Tema 4 menciona la escala de Borg.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F32","topic":"Tema 4","q":"¿Qué valor de VO2 pico corresponde a afectación ninguna-leve en la clasificación mostrada?","options":["<10 ml/kg/min","10-14 ml/kg/min","14-20 ml/kg/min","≥20 ml/kg/min"],"correct":[3],"explanation":"La tabla de variables de control sitúa ninguna-leve en ≥20 ml/kg/min.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F33","topic":"Tema 4","q":"¿Qué rango de VO2 pico corresponde a afectación moderada?","options":["14-20 ml/kg/min","10-14 ml/kg/min","<10 ml/kg/min",">30 ml/kg/min"],"correct":[0],"explanation":"La clasificación del Tema 4 sitúa el grado moderado entre 14 y 20 ml/kg/min.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F34","topic":"Tema 4","q":"¿Qué rango de VO2 pico corresponde a afectación severa?","options":["≥20","14-20","10-14","<5"],"correct":[2],"explanation":"La afectación severa se sitúa entre 10 y 14 ml/kg/min.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F35","topic":"Tema 4","q":"¿Qué valor de VO2 pico se asocia a requerir ayuda?","options":["≥30 ml/kg/min","20-25 ml/kg/min","14-20 ml/kg/min","<10 ml/kg/min"],"correct":[3],"explanation":"El Tema 4 indica que <10 ml/kg/min se asocia a requerir ayuda.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F36","topic":"Tema 4","q":"¿Qué recuperación de frecuencia cardiaca en el primer minuto aparece como variable cardiorrespiratoria?","options":["1-3 lpm","5-8 lpm","12-16 lpm","30-40 lpm"],"correct":[2],"explanation":"Los apuntes recogen una recuperación de 12-16 lpm en el primer minuto.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F37","topic":"Tema 4","q":"¿Cuál de estas es una variable cardiorrespiratoria de control?","options":["SpO2","Perímetro cefálico","Color de ojos","Longitud del pie"],"correct":[0],"explanation":"Entre las variables cardiorrespiratorias aparecen SpO2, ECG, VE pico y otras.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F38","topic":"Tema 4","q":"Durante el ejercicio, ¿qué ocurre con la absorción transdérmica según los apuntes?","options":["Se anula","Se duplica por el aumento del flujo a la piel","Siempre disminuye a la mitad","No cambia nunca"],"correct":[1],"explanation":"Los apuntes indican que la absorción transdérmica se duplica al aumentar el flujo cutáneo para la termorregulación.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F39","topic":"Tema 4","q":"¿Qué efecto general tienen los betabloqueantes sobre la frecuencia cardiaca en la tabla de los apuntes?","options":["La aumentan mucho","La disminuyen marcadamente","No producen ningún cambio","La duplican"],"correct":[1],"explanation":"La tabla muestra una disminución marcada de la frecuencia cardiaca con betabloqueantes.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F40","topic":"Tema 4","q":"¿Qué efecto general muestran los broncodilatadores sobre la frecuencia cardiaca?","options":["Disminución marcada","Aumento o sin cambio","Siempre la eliminan","Solo descenso"],"correct":[1],"explanation":"La tabla del Tema 4 muestra ↑↔ para broncodilatadores sobre la frecuencia cardiaca.","source":"Apuntes de Actividad Física y Salud · Tema 4"},{"id":"F41","topic":"Tema 2","q":"¿Qué estudia una ergoespirometría?","options":["Solo la fuerza muscular","Los sistemas respiratorio, cardiovascular y muscular de forma simultánea durante estrés físico","Solo la presión arterial","Solo la composición corporal"],"correct":[1],"explanation":"Los apuntes definen la ergoespirometría como el estudio simultáneo de los sistemas respiratorio, cardiovascular y muscular en condiciones de estrés físico.","source":"Apuntes de Actividad Física y Salud · Tema 2"},{"id":"F42","topic":"Tema 2","q":"¿Qué protocolo se describe como el más utilizado para valorar cardiopatía isquémica?","options":["Bruce","Harvard","Ruffier","Cooper"],"correct":[0],"explanation":"El protocolo de Bruce aparece como el más ampliamente utilizado en la valoración de la cardiopatía isquémica.","source":"Apuntes de Actividad Física y Salud · Tema 2"},{"id":"F43","topic":"Tema 2","q":"¿Qué caracteriza al protocolo de Bruce modificado o Naughton?","options":["Inicio más brusco","Inicio del esfuerzo más progresivo","Solo sirve para atletas","No aumenta la carga"],"correct":[1],"explanation":"Bruce modificado/Naughton inicia el esfuerzo de forma más progresiva.","source":"Apuntes de Actividad Física y Salud · Tema 2"},{"id":"F44","topic":"Tema 2","q":"¿En qué población puede ser útil Bruce modificado/Naughton?","options":["Solo deportistas de élite","Sujetos con baja condición física o tras un episodio isquémico agudo","Solo niños sanos","Solo personas sin patología"],"correct":[1],"explanation":"Los apuntes lo recomiendan en baja condición física, edad pediátrica o fase inmediata tras un episodio isquémico coronario agudo.","source":"Apuntes de Actividad Física y Salud · Tema 2"},{"id":"F45","topic":"Tema 2","q":"¿Qué prueba permite analizar la tolerancia y la limitación al ejercicio?","options":["CPET","DEXA","PAQ-A","PREDIMED"],"correct":[0],"explanation":"El Cardiopulmonary Exercise Test (CPET) se utiliza para analizar condición física, tolerancia y limitación al ejercicio.","source":"Apuntes de Actividad Física y Salud · Tema 2"},{"id":"F46","topic":"Tema 2","q":"¿Qué puede detectar el CPET durante el esfuerzo?","options":["Solo temperatura corporal","Arritmias y descensos del ST","Solo masa muscular","Solo IMC"],"correct":[1],"explanation":"Entre sus utilidades se incluye detectar arritmias, descensos de ST y eventos electrocardiográficos asociados al esfuerzo.","source":"Apuntes de Actividad Física y Salud · Tema 2"},{"id":"F47","topic":"Tema 2","q":"¿Qué comportamiento fisiológico puede valorar el CPET?","options":["Saturación de oxígeno","Coloración ocular","Longitud del fémur","Perímetro cefálico"],"correct":[0],"explanation":"El CPET permite detectar el comportamiento de la saturación de oxígeno.","source":"Apuntes de Actividad Física y Salud · Tema 2"},{"id":"F48","topic":"Tema 2","q":"¿Para qué puede emplearse el CPET en rehabilitación?","options":["Para valorar la respuesta a un programa de ejercicio","Para medir solo la talla","Para sustituir todas las pruebas clínicas","Para diagno let saved=JSON.parse(localStorage.getItem(KEY)||'{"block":0,"fails":[],"favs":[]}'), pool=[],idx=0,answers={},kind="normal",finished=false;
const $=s=>document.querySelector(s),qid=q=>q.id,save=()=>localStorage.setItem(KEY,JSON.stringify(saved));
function blocks(){return Math.ceil(BANK.length/SIZE)} function fill(){$("#block").innerHTML=Array.from({length:blocks()},(_,i)=>`<option value="${i}">Bloque ${i+1} · ${i*SIZE+1}-${Math.min((i+1)*SIZE,BANK.length)}</option>`).join("");$("#block").value=Math.min(saved.block,blocks()-1)}
function build(k="normal"){kind=k;idx=0;answers={};finished=false;if(k==="fails")pool=BANK.filter(q=>saved.fails.includes(q.id));else if(k==="favs")pool=BANK.filter(q=>saved.favs.includes(q.id));else{saved.block=+$("#block").value;save();pool=BANK.slice(saved.block*SIZE,(saved.block+1)*SIZE)}render()}
function grade(q,sel){let good=q.correct.length===sel.length&&q.correct.every(x=>sel.includes(x)); if(good)saved.fails=saved.fails.filter(x=>x!==q.id);else if(!saved.fails.includes(q.id))saved.fails.push(q.id);save();return good}
function render(){
 if(finished)return result();
 if(!pool.length){$("#app").innerHTML='<div class="card">No hay preguntas guardadas en esta sección.</div>';return}
 let q=pool[idx],a=answers[q.id],exam=$("#mode").value==="exam",last=idx===pool.length-1;
 $("#app").innerHTML=`<div class="card"><div class="meta"><span class="pill">${kind==="normal"?`Bloque ${saved.block+1} de ${blocks()}`:kind==="fails"?"Repaso de fallos":"Favoritas"}</span><span class="pill">${q.topic}</span><span class="stats">Pregunta ${idx+1} de ${pool.length}</span></div><div class="q">${q.q}</div><div id="opts">${q.options.map((o,i)=>`<button class="opt ${a?.sel?.includes(i)?"sel":""}" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>
 <button class="btn" id="star">${saved.favs.includes(q.id)?"★ Quitar favorita":"☆ Añadir favorita"}</button><button class="btn" id="check" ${a?.graded?"disabled":""}>${exam?"Guardar respuesta":"Comprobar"}</button>
 <div id="fb">${a?.graded&&!exam?`<div class="feedback"><b>${a.good?"✓ Correcta":"✗ Incorrecta"}</b><br>${q.explanation}<br><span class="muted">${q.source}</span></div>`:""}</div>
 <div class="nav"><button class="btn" id="prev" ${idx===0?"disabled":""}>← Anterior</button><button class="btn" id="next">${last?"Finalizar bloque":"Siguiente →"}</button></div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(answers[q.id]?.graded)return;answers[q.id]={sel:[+b.dataset.i],graded:false};render()});
 $("#star").onclick=()=>{let p=saved.favs.indexOf(q.id);p>=0?saved.favs.splice(p,1):saved.favs.push(q.id);save();render()};
 $("#check").onclick=()=>{let a=answers[q.id];if(!a?.sel?.length)return alert("Selecciona una respuesta.");a.graded=true;a.good=grade(q,a.sel);answers[q.id]=a;render()};
 $("#prev").onclick=()=>{if(idx>0){idx--;render()}};$("#next").onclick=()=>{if(!answers[q.id]?.graded)return alert("Primero responde la pregunta.");if(last){finished=true;render()}else{idx++;render()}};
}
function result(){let g=Object.values(answers).filter(a=>a.good).length,n=pool.length,note=(g/Math.max(n,1)*10).toFixed(1),last=saved.block>=blocks()-1;
 $("#app").innerHTML=`<div class="card" style="text-align:center"><div class="muted">BLOQUE FINALIZADO</div><div class="big">${note}/10</div><h2>${g} aciertos de ${n}</h2><div class="nav" style="justify-content:center"><button class="btn" id="repeat">Repetir bloque</button>${kind==="normal"&&!last?'<button class="btn" id="nextb">Siguiente bloque de 20 →</button>':""}</div></div>`;
 $("#repeat").onclick=()=>build(kind);let nb=$("#nextb");if(nb)nb.onclick=()=>{saved.block++;save();fill();build("normal")}
}
fill();build();$("#block").onchange=()=>build("normal");$("#mode").onchange=()=>build(kind);$("#fails").onclick=()=>build("fails");$("#favs").onclick=()=>build("favs");
</script></body></html>
