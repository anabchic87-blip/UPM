let questions=[],i=0,score=0,hits=0,locked=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(theme){
 let pool=theme==='Todos'?Object.values(BANK).flat():BANK[theme];
 questions=shuffle(pool).slice(0,Math.min(10,pool.length));
 document.getElementById('home').classList.add('hidden');
 document.getElementById('game').classList.remove('hidden'); show();
}
function show(){
 locked=false; const q=questions[i];
 counter.textContent=`Pregunta ${i+1} / ${questions.length}`; word.textContent=q.word;
 progress.style.width=`${(i/questions.length)*100}%`; feedback.textContent=''; next.classList.add('hidden');
 answers.innerHTML='';
 q.options.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>answer(b,o,q.correct);answers.appendChild(b)});
}
function answer(btn,val,correct){
 if(locked)return;locked=true;
 [...answers.children].forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('good')});
 if(val===correct){score+=100;hits++;feedback.textContent='✅ ¡Correcto! +100 puntos';}
 else{btn.classList.add('bad');feedback.textContent=`❌ La respuesta correcta es: ${correct}`;}
 document.getElementById('score').textContent=score;next.classList.remove('hidden');
}
function nextQ(){i++;if(i<questions.length)show();else finish()}
function finish(){
 game.classList.add('hidden');result.classList.remove('hidden');
 let pct=Math.round(hits/questions.length*100),msg=pct===100?'🌟 ¡Perfecto!':pct>=80?'👏 ¡Muy bien!':pct>=60?'💪 ¡Buen trabajo!':'📚 ¡A seguir practicando!';
 final.innerHTML=`${msg}<br><b>${score} puntos</b><br>✅ ${hits} aciertos &nbsp; ❌ ${questions.length-hits} errores<br>${pct}% correcto`;
}
