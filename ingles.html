function shuffle(a){let b=[...a];for(let j=b.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[b[j],b[k]]=[b[k],b[j]]}return b}
function allWords(){return Object.entries(BANK).flatMap(([theme,arr])=>arr.map(x=>({...x,theme})))}
function startNormal(theme){hardMode=false;let pool=theme==='Todos'?allWords():(BANK[theme]||[]).map(x=>({...x,theme}));questions=shuffle(pool).slice(0,Math.min(10,pool.length)).map(q=>({...q,type:'en-es'}));begin()}

 hardMode=true;let pool=shuffle(allWords()).slice(0,20);

}
function begin(){$('home').classList.add('hidden');$('game').classList.remove('hidden');i=0;score=0;hits=0;show()}
function makeOptions(q){
 if(q.type==='en-es') return shuffle(q.options);
 let pool=allWords().filter(x=>x.word!==q.word).map(x=>x.word);
 return shuffle([q.word,...shuffle(pool).slice(0,3)]);
}
function maskWord(w){
 let chars=[...w]; let letters=chars.map((c,j)=>/[a-z]/i.test(c)?j:-1).filter(j=>j>=0);

 return chars.map((c,j)=>hide.includes(j)?'_':c).join(' ');
}

 else{$('modeTag').textContent='DIFÍCIL · Completar';$('prompt').textContent=`Completa la palabra en inglés · Significado: ${q.correct}`;$('word').textContent=maskWord(q.word);$('completeBox').classList.remove('hidden');setTimeout(()=>$('completeInput').focus(),100)}
}
function renderOptions(opts,correct){opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>answer(b,o,correct);$('answers').appendChild(b)})}
function answer(btn,val,correct){if(locked)return;locked=true;[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('good')});if(val===correct){score+=100;hits++;$('feedback').textContent='✅ ¡Correcto! +100 puntos'}else{btn.classList.add('bad');$('feedback').textContent=`❌ Correcta: ${correct}`}$('score').textContent=score;$('next').classList.remove('hidden')}
function norm(s){return s.trim().toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u')}
function checkComplete(){if(locked)return;locked=true;let q=questions[i],v=$('completeInput').value;if(norm(v)===norm(q.word)){score+=100;hits++;$('feedback').textContent='✅ ¡Perfecto! +100 puntos';$('completeInput').style.borderColor='#f59e0b'}else{$('feedback').textContent=`❌ Era: ${q.word}`;$('completeInput').style.borderColor='#e21b3c'}$('score').textContent=score;$('next').classList.remove('hidden')}
$('completeInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkComplete()});
function nextQ(){i++;if(i<questions.length)show();else finish()}
function finish(){$('game').classList.add('hidden');$('result').classList.remove('hidden');let pct=Math.round(hits/questions.length*100),msg=pct===100?'🌟 ¡Perfecto!':pct>=80?'👏 ¡Muy bien!':pct>=60?'💪 ¡Buen trabajo!':'📚 ¡A seguir practicando!';$('final').innerHTML=`${msg}<br><b>${score} puntos</b><br>✅ ${hits} aciertos &nbsp; ❌ ${questions.length-hits} errores<br>${pct}% correcto`}
</script></body></html>
