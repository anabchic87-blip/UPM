<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fisiología del Ejercicio · 265 preguntas</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1c2d3b;background:#eef4f8}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#10384a;color:white;z-index:5;box-shadow:0 2px 12px #0002}.head{max-width:1100px;margin:auto;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h1{font-size:19px;margin:0}.head small{color:#b9dce7}.container{max-width:1100px;margin:22px auto;padding:0 15px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px}.panel{background:#fff;border-radius:16px;padding:23px;box-shadow:0 4px 20px #153b5112}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.btn,select,input{border:1px solid #c8d7e0;border-radius:9px;padding:10px 12px;background:white;color:#14394b;font:inherit}.btn{cursor:pointer;font-weight:650}.btn:hover{background:#eaf5f7}.btn.primary{background:#087a84;color:white;border-color:#087a84}.btn.primary:hover{background:#05616a}.btn:disabled{opacity:.4;cursor:not-allowed}.stats{display:flex;gap:12px;flex-wrap:wrap;color:#547080;font-size:14px}.progress{height:9px;background:#e7edf1;border-radius:9px;overflow:hidden;margin:12px 0 24px}.progress div{height:100%;width:0;background:#0b9393;transition:width .2s}.eyebrow{color:#517888;font-size:14px;font-weight:700}.question{font-size:22px;line-height:1.5;margin:12px 0 24px}.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;background:#f7fafc;border:2px solid #dce6ec;padding:15px;border-radius:12px;cursor:pointer;font:inherit;line-height:1.45;color:#20394a;display:flex;gap:12px}.answer:hover:not(:disabled){border-color:#0b9393;background:#edf9f9}.answer b{color:#087a84}.answer.right{border-color:#168d67;background:#e7f7ed}.answer.wrong{border-color:#cc5b5b;background:#fff0f0}.answer:disabled{cursor:default}.feedback{margin-top:20px;padding:16px;border-radius:12px;background:#f0f7f8;border-left:4px solid #0b9393;line-height:1.55}.feedback.good{background:#eaf8f0;border-color:#168d67}.feedback.bad{background:#fff2f0;border-color:#ce5c5c}.bottom{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap;margin-top:24px}.side h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:55vh;overflow:auto}.cell{font-size:12px;padding:8px 0;border:1px solid #dce6ec;border-radius:7px;background:#f7fafc;cursor:pointer}.cell.current{outline:2px solid #0b9393}.cell.ok{background:#d5f1e1}.cell.no{background:#f9d9d9}.cell.marked{background:#fff0c5}.tag{display:inline-block;padding:4px 8px;border-radius:7px;background:#ffe9cc;color:#875108;font-size:12px;font-weight:800;margin-left:8px}.tag.red{background:#ffe3e3;color:#aa3232}.summary{font-size:14px;color:#526e7e}.hidden{display:none!important}.mode-note{font-size:13px;color:#5c7482}.toplink{color:#d5f8f8;text-decoration:none;font-size:13px}@media(max-width:780px){.container{grid-template-columns:1fr}.side{order:2}.question{font-size:19px}.panel{padding:17px}.head h1{font-size:16px}.grid{grid-template-columns:repeat(10,1fr)}}
</style></head><body><header><div class="head"><div><h1>Fisiología del Ejercicio · Test interactivo</h1><small>265 preguntas del PDF · Temas 1–6 · Todas seguidas</small></div><a class="toplink" href="index.html">⌂ Volver al Campus</a></div></header><main class="container"><section class="panel"><div class="toolbar"><label for="mode">Modo:</label><select id="mode"><option value="study">Estudio · corrección inmediata</option><option value="exam">Examen · corregir al finalizar</option></select><button class="btn" id="reset">Reiniciar respuestas</button><button class="btn" id="finish">Finalizar y corregir</button></div><div class="stats"><span id="counter"></span><span id="done"></span><span id="score"></span></div><div class="progress"><div id="bar"></div></div><div class="eyebrow" id="eyebrow"></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback hidden" id="feedback"></div><div class="bottom"><button class="btn" id="prev">← Anterior</button><button class="btn" id="fav">☆ Marcar para repasar</button><button class="btn primary" id="next">Siguiente →</button></div><p class="mode-note">Las respuestas y los marcadores se guardan automáticamente en este navegador. Las soluciones proceden del propio PDF.</p></section><aside class="panel side"><h3>Navegación</h3><div class="toolbar"><select id="filter"><option value="all">Todas las preguntas</option><option value="wrong">Solo falladas</option><option value="marked">Marcadas para repasar</option><option value="unanswered">Sin responder</option><option value="critical">Eliminatorias</option></select></div><div class="summary" id="navSummary"></div><div class="grid" id="grid"></div><p class="summary">Verde: acertada · Rojo: fallada · Amarillo: marcada</p></aside></main><script>
const BANK=[{"id": "1.1", "tema": 1, "q": "[CLAVE] La fisiología del ejercicio se define como el estudio de:", "options": ["La aplicación de conceptos fisiológicos al entrenamiento de atletas para mejorar el rendimiento", "El mantenimiento de un medio interno constante", "Los efectos del medio ambiente (calor, frío, altitud) sobre el funcionamiento del organismo", "Cómo la estructura y la función del cuerpo se alteran con la exposición a episodios agudos y crónicos de ejercicio"], "key": "d", "explanation": "Es la definición literal de los apuntes. Los efectos del ambiente son la fisiología ambiental, aplicar al entrenamiento es la fisiología del deporte y el medio interno constante es la homeostasis.", "tag": "CLAVE"}, {"id": "1.2", "tema": 1, "q": "[CLAVE] La aplicación de los conceptos de la fisiología del ejercicio al entrenamiento de atletas y a la mejora del rendimiento se denomina:", "options": ["Fisiología del deporte", "Bioenergética", "Fisiología traslacional", "Fisiología ambiental"], "key": "a", "explanation": "La fisiología del deporte APLICA lo que estudia la fisiología del ejercicio al entrenamiento y al rendimiento.", "tag": "CLAVE"}, {"id": "1.3", "tema": 1, "q": "[CLAVE] El estudio de los efectos del calor, el frío o la altitud sobre el funcionamiento del organismo corresponde a la:", "options": ["Fisiología ambiental", "Fisiología del deporte", "Fisiología del ejercicio", "Fisiología traslacional"], "key": "a", "explanation": "La fisiología ambiental añade el entorno como estresor.", "tag": "CLAVE"}, {"id": "1.4", "tema": 1, "q": "La homeostasis se define como:", "options": ["La respuesta aguda a una sesión de ejercicio", "La adaptación crónica al entrenamiento", "El mantenimiento de un entorno interno constante", "El estudio de la función de los organismos"], "key": "c", "explanation": "Homeostasis = medio interno constante. «Estudio de la función de los organismos» es la definición de fisiología.", "tag": ""}, {"id": "1.5", "tema": 1, "q": "Una única sesión de ejercicio provoca:", "options": ["Una adaptación longitudinal", "Un efecto de entrenamiento", "Una adaptación crónica", "Una respuesta aguda"], "key": "d", "explanation": "Ejercicio agudo = una sola sesión. La adaptación crónica requiere sesiones repetidas durante semanas o meses.", "tag": ""}, {"id": "1.6", "tema": 1, "q": "¿Cuál de estos cambios es una adaptación crónica al ejercicio?", "options": ["Aumento de la ventilación durante un sprint", "Subida de la FC durante una carrera", "Descenso de la FC de reposo tras 12 semanas de entrenamiento", "Subida del lactato al final de una serie"], "key": "c", "explanation": "Las adaptaciones crónicas aparecen tras semanas o meses (↓FC de reposo, ↑VO₂máx). Las demás son respuestas agudas que desaparecen al terminar.", "tag": ""}, {"id": "1.7", "tema": 1, "q": "¿Qué investigador estudió el metabolismo energético en músculo aislado de rana, hizo los primeros estudios fisiológicos en corredores y recibió el Premio Nobel?", "options": ["David Bruce Dill", "John S. Haldane", "Archibald V. Hill", "Per-Olof Åstrand"], "key": "c", "explanation": "A. V. Hill (los apuntes dicen Nobel 1921; oficialmente es el de 1922, compartido con Meyerhof).", "tag": ""}, {"id": "1.8", "tema": 1, "q": "John S. Haldane es conocido por:", "options": ["Desarrollar métodos para medir el uso de O₂ durante el ejercicio", "Crear el Compendio de actividades físicas", "Reintroducir la biopsia muscular", "Fundar el Instituto de Investigación Muscular de Copenhague"], "key": "a", "explanation": "De Haldane viene la transformación de Haldane (Tema 3), basada en que el N₂ inspirado es igual al espirado.", "tag": ""}, {"id": "1.9", "tema": 1, "q": "El Laboratorio de Fatiga de Harvard fue fundado por ______ y dirigido por ______:", "options": ["A. V. Hill / J. S. Haldane", "Lawrence J. Henderson / David Bruce Dill", "George Wells Fitz / Peter Karpovich", "Bengt Saltin / Per-Olof Åstrand"], "key": "b", "explanation": "Henderson (bioquímico) lo fundó y D. B. Dill lo dirigió. Se centró en el movimiento humano y el estrés ambiental.", "tag": ""}, {"id": "1.10", "tema": 1, "q": "En el Laboratorio de Fatiga de Harvard, el aire espirado se recogía en:", "options": ["Un espirómetro de circuito cerrado", "Una cámara calorimétrica", "Una bolsa de Douglas", "Un analizador breath-by-breath"], "key": "c", "explanation": "Se recogía en bolsa de Douglas y luego se analizaban O₂ y CO₂ con un analizador químico de gases.", "tag": ""}, {"id": "1.11", "tema": 1, "q": "¿Quién reintrodujo en 1966 la aguja de biopsia para estudiar el músculo humano?", "options": ["John Holloszy", "Jonas Bergström", "Erik Hohwü-Christensen", "Phil Gollnick"], "key": "b", "explanation": "Bergström, de la escuela escandinava, en 1966.", "tag": ""}, {"id": "1.12", "tema": 1, "q": "Bengt Saltin fundó:", "options": ["El American College of Sports Medicine", "El Laboratorio de Fatiga de Harvard", "El Instituto de Investigación Muscular de Copenhague", "El Laboratorio de Investigación del Rendimiento Humano"], "key": "c", "explanation": "Saltin: Copenhague. El Laboratorio de Investigación del Rendimiento Humano (1974) es de Buskirk.", "tag": ""}, {"id": "1.13", "tema": 1, "q": "Per-Olof Åstrand es conocido por sus estudios (años 50-60) sobre:", "options": ["La aptitud física y la capacidad de resistencia", "El metabolismo energético en rana", "El reclutamiento selectivo de fibras", "La biopsia muscular"], "key": "a", "explanation": "Åstrand: aptitud física y resistencia. Christensen estudió el metabolismo de CH y grasas a finales de los 30.", "tag": ""}, {"id": "1.14", "tema": 1, "q": "Karen Piehl fue de las primeras en demostrar que:", "options": ["Las mujeres tienen menos hemoglobina", "El lactato es un producto de desecho", "El VO₂máx es el mejor predictor del rendimiento", "El sistema nervioso recluta selectivamente fibras de tipo I y de tipo II"], "key": "d", "explanation": "Piehl: reclutamiento selectivo de fibras I y II.", "tag": ""}, {"id": "1.15", "tema": 1, "q": "Barbara Ainsworth es conocida por:", "options": ["Fundar el ECSS", "Demostrar el reclutamiento selectivo de fibras", "Ser pionera en cuestiones de la mujer deportista", "La evaluación y epidemiología de la AF, autora del Compendio de actividades físicas (METs)"], "key": "d", "explanation": "Ainsworth: Compendio de actividades (METs, Tema 4). Drinkwater fue la pionera en la mujer deportista.", "tag": ""}, {"id": "1.16", "tema": 1, "q": "John Holloszy y Charles Tipton se asocian con:", "options": ["El enfoque bioquímico: metabolismo muscular y fatiga en ratas y ratones", "La bolsa de Douglas", "La promoción del estilo de vida saludable", "La aguja de biopsia"], "key": "a", "explanation": "Holloszy y Tipton: enfoque bioquímico. Cureton sentó las bases del ejercicio para la salud.", "tag": ""}, {"id": "1.17", "tema": 1, "q": "Un estudio que mide a los mismos sujetos en varios momentos a lo largo del tiempo es:", "options": ["Longitudinal", "Transversal", "Una revisión sistemática", "Un estudio de casos y controles"], "key": "a", "explanation": "Longitudinal = mismos sujetos a lo largo del tiempo.", "tag": ""}, {"id": "1.18", "tema": 1, "q": "Respecto a los diseños longitudinales frente a los transversales, es correcto que:", "options": ["Los transversales son más precisos pero más caros", "Los longitudinales comparan grupos distintos en un único momento", "Ambos tienen la misma precisión y coste", "Los longitudinales son más precisos, pero lentos y caros"], "key": "d", "explanation": "Transversal = rápido y barato, menos preciso; compara grupos distintos en un momento.", "tag": ""}, {"id": "1.19", "tema": 1, "q": "Comparar el VO₂máx de corredores y sedentarios medido una sola vez es un diseño:", "options": ["De intervención", "Experimental cruzado", "Transversal", "Longitudinal"], "key": "c", "explanation": "Grupos distintos en un único momento = transversal. Las diferencias pueden deberse a la genética, no solo al entrenamiento.", "tag": ""}, {"id": "1.20", "tema": 1, "q": "En un gráfico científico, el eje X representa normalmente:", "options": ["El error estándar", "La variable independiente (la que controla el diseño del estudio)", "La variable dependiente", "La variable de confusión"], "key": "b", "explanation": "X = independiente; Y = dependiente (cambia en función de X).", "tag": ""}, {"id": "1.21", "tema": 1, "q": "Los ergómetros se utilizan para:", "options": ["Medir la composición corporal", "Analizar gases respiratorios", "Medir el trabajo físico en condiciones estandarizadas", "Determinar el lactato en sangre"], "key": "c", "explanation": "Los más usados son la cinta de correr y el cicloergómetro.", "tag": ""}, {"id": "1.22", "tema": 1, "q": "¿Cuál de estas organizaciones es europea?", "options": ["ECSS", "ACSM", "NSCA", "AHA"], "key": "a", "explanation": "ECSS = European College of Sport Science. ACSM, NSCA y AHA son estadounidenses.", "tag": ""}, {"id": "1.23", "tema": 1, "q": "La fisiología traslacional:", "options": ["Lleva los resultados de la investigación básica a la clínica, la práctica clínica y la política sanitaria", "Estudia los efectos del ambiente", "Compara grupos en un único momento", "Aplica la fisiología al entrenamiento de atletas"], "key": "a", "explanation": "«Del laboratorio a la cabecera del paciente y de ahí a la comunidad».", "tag": ""}, {"id": "1.24", "tema": 1, "q": "El principio de entrenamiento que dice que las adaptaciones dependen del tipo, la intensidad y el gesto del ejercicio es el de:", "options": ["Especificidad", "Reversibilidad", "Sobrecarga progresiva", "Individualidad"], "key": "a", "explanation": "Especificidad. Reversibilidad = se pierden al dejar de entrenar; individualidad = cada persona responde distinto.", "tag": ""}, {"id": "1.25", "tema": 1, "q": "Si un deportista deja de entrenar y pierde las adaptaciones conseguidas, se cumple el principio de:", "options": ["Variación", "Reversibilidad", "Especificidad", "Sobrecarga"], "key": "b", "explanation": "Reversibilidad (desentrenamiento).", "tag": ""}, {"id": "2.1", "tema": 2, "q": "[CLAVE] El ATP es una forma de energía:", "options": ["Mecánica externa", "Potencial química, almacenada en los enlaces de fosfato", "Cinética, porque produce movimiento", "Térmica"], "key": "b", "explanation": "El ATP es energía potencial química. Al hidrolizarse, el músculo la transforma en energía cinética (movimiento) y calor.", "tag": "CLAVE"}, {"id": "2.2", "tema": 2, "q": "[CLAVE] La energía cinética se calcula como:", "options": ["m · v", "m · g · h", "F · d · t", "½ · m · v²"], "key": "d", "explanation": "Ec. 1 del formulario: Ec = ½·m·v². La Ec. 2 es la energía potencial: Ep = m·g·h.", "tag": "CLAVE"}, {"id": "2.3", "tema": 2, "q": "[CLAVE] Un deportista de 70 kg sube a una plataforma de 0,5 m. Su energía potencial ganada (g = 9,8 m/s²) es aproximadamente:", "options": ["686 J", "343 J", "35 J", "17 J"], "key": "b", "explanation": "Ep = m·g·h = 70 × 9,8 × 0,5 = 343 J.", "tag": "CLAVE"}, {"id": "2.4", "tema": 2, "q": "[CLAVE] Las vías metabólicas que liberan energía degradando moléculas grandes se denominan:", "options": ["Catabolismo", "Anabolismo", "Lipogénesis", "Gluconeogénesis"], "key": "a", "explanation": "Catabolismo libera energía (glucogenólisis, glucólisis, β-oxidación). Anabolismo la consume.", "tag": "CLAVE"}, {"id": "2.5", "tema": 2, "q": "[CLAVE] ¿Cuál de las siguientes es una vía anabólica?", "options": ["Glucogenogénesis", "Glucogenólisis", "β-oxidación", "Glucólisis"], "key": "a", "explanation": "Anabólicas: resíntesis de PCr, glucogenogénesis, gluconeogénesis y lipogénesis.", "tag": "CLAVE"}, {"id": "2.6", "tema": 2, "q": "[CLAVE] La formación de glucosa a partir de glicerol, lactato o aminoácidos se llama:", "options": ["Glucogenólisis", "Gluconeogénesis", "Glucólisis", "Lipólisis"], "key": "b", "explanation": "Gluconeogénesis = glucosa nueva a partir de precursores no glucídicos (sobre todo en el hígado).", "tag": "CLAVE"}, {"id": "2.7", "tema": 2, "q": "[CLAVE] La degradación de los triglicéridos en glicerol y ácidos grasos libres se llama:", "options": ["Lipólisis", "Glucogenólisis", "Lipogénesis", "β-oxidación"], "key": "a", "explanation": "Lipólisis (por lipasas). Después los AGL entran en la β-oxidación para formar acetil-CoA.", "tag": "CLAVE"}, {"id": "2.8", "tema": 2, "q": "Las enzimas:", "options": ["Solo actúan en presencia de O₂", "Aumentan la energía de activación", "Inician las reacciones y fijan el rendimiento de ATP", "Disminuyen la energía de activación de la reacción"], "key": "d", "explanation": "Las enzimas (sufijo -asa) no inician reacciones ni fijan el ATP; facilitan la reacción bajando la energía de activación.", "tag": ""}, {"id": "2.9", "tema": 2, "q": "La enzima limitante del sistema ATP-PCr es:", "options": ["Isocitrato deshidrogenasa (ICD)", "Fosfofructoquinasa (PFK)", "Creatina quinasa (CK)", "Citocromo oxidasa"], "key": "c", "explanation": "PCr + CK → Cr + Pi + energía, que se usa para resintetizar ATP.", "tag": ""}, {"id": "2.10", "tema": 2, "q": "El sistema ATP-PCr:", "options": ["Es aeróbico y está en la mitocondria", "Produce 2-3 ATP y dura de 15 s a 2 min", "Produce 1 ATP por mol de PCr y dura unos 3-15 s de esfuerzo máximo", "Es el de menor velocidad de producción de ATP"], "key": "c", "explanation": "Es el de mayor potencia (tasa relativa 10), pero con muy poca capacidad (<15 s).", "tag": ""}, {"id": "2.11", "tema": 2, "q": "La glucólisis anaeróbica a partir de glucógeno muscular rinde neto:", "options": ["1 ATP", "3 ATP", "2 ATP", "32 ATP"], "key": "b", "explanation": "Desde glucosa se gasta 1 ATP para formar glucosa-6-fosfato (neto 2); desde glucógeno no (neto 3).", "tag": ""}, {"id": "2.12", "tema": 2, "q": "La enzima limitante de la glucólisis es:", "options": ["La fosfofructoquinasa (PFK)", "La lipasa", "La citrato sintasa", "La creatina quinasa"], "key": "a", "explanation": "PFK: se activa con AMP, ADP, Pi y ↑pH; se inhibe con ATP, PCr, citrato y ↓pH.", "tag": ""}, {"id": "2.13", "tema": 2, "q": "La actividad de la PFK aumenta cuando:", "options": ["Baja el pH", "Aumentan ADP, AMP y Pi", "Aumenta la PCr", "Aumentan ATP y citrato"], "key": "b", "explanation": "Retroalimentación negativa: cuando cae el ATP (sube ADP/AMP) la vía se acelera.", "tag": ""}, {"id": "2.14", "tema": 2, "q": "¿Dónde tiene lugar la glucólisis?", "options": ["En la membrana mitocondrial interna", "En la matriz mitocondrial", "En el retículo sarcoplásmico", "En el citoplasma"], "key": "d", "explanation": "Los 10-12 pasos de la glucólisis ocurren en el citoplasma.", "tag": ""}, {"id": "2.15", "tema": 2, "q": "Según los apuntes, la oxidación completa de 1 molécula de glucosa rinde:", "options": ["2 ATP", "106 ATP", "36-39 ATP", "32 ATP"], "key": "d", "explanation": "32 ATP (glucógeno 33): 2 de glucólisis + 2 GTP + 10 NADH × 2,5 + 2 FADH₂ × 1,5. El 36-39 es el valor clásico antiguo.", "tag": ""}, {"id": "2.16", "tema": 2, "q": "En la cadena de transporte de electrones, cada NADH y cada FADH₂ aportan:", "options": ["2 y 1 ATP", "1,5 y 2,5 ATP", "2,5 y 1,5 ATP", "3 y 2 ATP"], "key": "c", "explanation": "Valores actuales: 2,5 ATP/NADH y 1,5 ATP/FADH₂.", "tag": ""}, {"id": "2.17", "tema": 2, "q": "La oxidación de una molécula de ácido palmítico (16 C) produce un rendimiento neto de:", "options": ["106 ATP", "32 ATP", "8 ATP", "64 ATP"], "key": "a", "explanation": "8 (nivel de sustrato) + 98 (fosforilación oxidativa: 28 de β-oxidación + 72 de Krebs − 2 de activación) = 106.", "tag": ""}, {"id": "2.18", "tema": 2, "q": "Un ácido graso de 16 carbonos produce ______ acetil-CoA, frente a ______ de una glucosa:", "options": ["7 / 2", "8 / 1", "8 / 2", "16 / 6"], "key": "c", "explanation": "16 C ÷ 2 = 8 acetil-CoA. Por eso la grasa necesita más O₂ pero da mucho más ATP.", "tag": ""}, {"id": "2.19", "tema": 2, "q": "La enzima limitante del ciclo de Krebs es:", "options": ["La succinato deshidrogenasa, activada por ATP", "La isocitrato deshidrogenasa (ICD), activada por ADP y Ca²⁺ e inhibida por ATP y NADH", "La PFK, inhibida por citrato", "La citrato sintasa, activada por NADH"], "key": "b", "explanation": "ICD: activadores ADP, Ca²⁺, NAD; inhibidores ATP, NADH.", "tag": ""}, {"id": "2.20", "tema": 2, "q": "La enzima limitante de la cadena de transporte de electrones es:", "options": ["La lactato deshidrogenasa", "La citocromo oxidasa", "La hexoquinasa", "La creatina quinasa"], "key": "b", "explanation": "Citocromo oxidasa: activada por ADP y Pi, inhibida por ATP.", "tag": ""}, {"id": "2.21", "tema": 2, "q": "En la cadena de transporte de electrones, el H⁺ se une al O₂ formando:", "options": ["Ácido pirúvico", "CO₂", "Agua, lo que evita la acidosis", "Lactato"], "key": "c", "explanation": "El O₂ es el aceptor final: H⁺ + O₂ → H₂O.", "tag": ""}, {"id": "2.22", "tema": 2, "q": "[CLAVE] ¿Cuál de estas NO es una forma en que el músculo usa el lactato?", "options": ["Transportarlo por MCT a otra célula y oxidarlo allí", "Enviarlo al hígado para convertirlo en glucosa", "Convertirlo en ácidos grasos dentro de la fibra para almacenarlo como triglicérido", "Oxidarlo en las mitocondrias de la misma fibra"], "key": "c", "explanation": "Los tres destinos de los apuntes: oxidación en la misma fibra, lanzadera a otra célula y gluconeogénesis hepática (ciclo de Cori).", "tag": "CLAVE"}, {"id": "2.23", "tema": 2, "q": "[CLAVE] El ciclo de Cori consiste en:", "options": ["Convertir la glucosa en grasa", "Llevar el lactato al hígado y reconvertirlo en glucosa", "Oxidar el lactato en el corazón", "Resintetizar PCr en la recuperación"], "key": "b", "explanation": "Lactato del músculo → hígado → glucosa (gluconeogénesis) → vuelve al músculo.", "tag": "CLAVE"}, {"id": "2.24", "tema": 2, "q": "[CLAVE] Actualmente el lactato se considera:", "options": ["La causa principal del flato", "Un combustible y un intercambio de energía entre tejidos", "Un sustrato exclusivo del hígado", "Un producto de desecho sin utilidad"], "key": "b", "explanation": "Teoría de la lanzadera de lactato: el lactato no es un desecho.", "tag": "CLAVE"}, {"id": "2.25", "tema": 2, "q": "En la lanzadera de lactato, el transportador encargado principalmente de SACAR el lactato de la célula es:", "options": ["GLUT-4", "El intercambiador Cl⁻/HCO₃⁻", "MCT1", "MCT4"], "key": "d", "explanation": "MCT4 lo saca; MCT1 lo introduce (bidireccional según Cupeiro, 2011).", "tag": ""}, {"id": "2.26", "tema": 2, "q": "El lactato atraviesa el sarcolema sobre todo mediante:", "options": ["Bombas de Na⁺/K⁺", "El intercambiador iónico", "Difusión simple", "Transportadores MCT"], "key": "d", "explanation": "La mayor parte por MCT; el intercambiador iónico y la difusión simple aportan poco.", "tag": ""}, {"id": "2.27", "tema": 2, "q": "[CLAVE] Respecto a la interconversión de los principios inmediatos, es correcto que:", "options": ["Los carbohidratos no pueden convertirse en grasa", "Los ácidos grasos se convierten fácilmente en glucosa", "Las proteínas no pueden convertirse en glucosa", "Los ácidos grasos no pueden convertirse en glucosa; de la grasa solo el glicerol"], "key": "d", "explanation": "El acetil-CoA no vuelve a piruvato, así que los AG no dan glucosa; el glicerol sí (gluconeogénesis).", "tag": "CLAVE"}, {"id": "2.28", "tema": 2, "q": "[CLAVE] El exceso de glucosa se almacena como grasa mediante:", "options": ["Glucosa → acetil-CoA → ácidos grasos (lipogénesis)", "Gluconeogénesis", "Transaminación", "β-oxidación"], "key": "a", "explanation": "CH → grasa sí es posible, por lipogénesis. El cruce de caminos es el acetil-CoA.", "tag": "CLAVE"}, {"id": "2.29", "tema": 2, "q": "[CLAVE] Los aminoácidos glucogénicos (p. ej., alanina) pueden:", "options": ["Usarse solo para síntesis proteica", "Convertirse en glucosa en el hígado (ciclo glucosa-alanina)", "Convertirse solo en grasa", "Formar PCr directamente"], "key": "b", "explanation": "Proteínas → glucosa sí, por gluconeogénesis. Los cetogénicos dan acetil-CoA.", "tag": "CLAVE"}, {"id": "2.30", "tema": 2, "q": "El transportador GLUT-4:", "options": ["Solo se activa con insulina", "Es propio del músculo y se activa con insulina y con ↑[Ca²⁺] intracelular (contracción)", "Es específico del hepatocito", "Transporta lactato"], "key": "b", "explanation": "Por eso el ejercicio facilita la entrada de glucosa en el músculo aunque haya poca insulina.", "tag": ""}, {"id": "2.31", "tema": 2, "q": "Según el concepto de crossover, por debajo del ~60 % del VO₂máx el sustrato principal es:", "options": ["La fosfocreatina", "Los lípidos", "Las proteínas", "El glucógeno muscular"], "key": "b", "explanation": "<60 % VO₂máx predominan los lípidos; >75 % predominan los CH. El entrenamiento desplaza el cruce a la derecha.", "tag": ""}, {"id": "2.32", "tema": 2, "q": "Con el entrenamiento de resistencia, el punto de cruce (crossover):", "options": ["Se desplaza a la derecha: a la misma intensidad se usa más grasa", "Se desplaza a la izquierda: se usan más CH", "No cambia", "Desaparece"], "key": "a", "explanation": "El entrenado oxida más grasa a la misma intensidad (ahorra glucógeno).", "tag": ""}, {"id": "2.33", "tema": 2, "q": "Ordena de mayor a menor la velocidad relativa de formación de ATP:", "options": ["Oxidativo de grasas > oxidativo de CH > glucólisis > ATP-PCr", "ATP-PCr > glucólisis > oxidativo de CH > oxidativo de grasas", "Glucólisis > ATP-PCr > grasas > CH", "ATP-PCr > oxidativo de CH > glucólisis > grasas"], "key": "b", "explanation": "Tasas relativas 10 / 5 / 2,5 / 1,5. La capacidad va al revés (de <15 s a días).", "tag": ""}, {"id": "2.34", "tema": 2, "q": "Según el continuo energético, en 10 s de esfuerzo máximo la contribución aproximada es:", "options": ["100 % anaeróbica", "50 % y 50 %", "10 % anaeróbica y 90 % aeróbica", "90 % anaeróbica y 10 % aeróbica"], "key": "d", "explanation": "10 s 90/10; 60 s 70/30; 2 min 60/40; 120 min 1/99. Ningún sistema aporta el 100 %.", "tag": ""}, {"id": "2.35", "tema": 2, "q": "En un esfuerzo máximo de 2 minutos, la contribución aproximada es:", "options": ["90 / 10", "30 / 70", "1 / 99", "60 % anaeróbica / 40 % aeróbica"], "key": "d", "explanation": "Tabla del continuo energético: 2 min = 60/40.", "tag": ""}, {"id": "2.36", "tema": 2, "q": "Las fibras de tipo I, comparadas con las de tipo II:", "options": ["Tienen menos mitocondrias y más enzimas glucolíticas", "No responden al entrenamiento", "Tienen menor capacidad oxidativa", "Tienen más mitocondrias y más enzimas oxidativas"], "key": "d", "explanation": "Tipo I = oxidativas. Las tipo II son mejores para la producción glucolítica.", "tag": ""}, {"id": "2.37", "tema": 2, "q": "Son enzimas marcadoras de la capacidad oxidativa del músculo:", "options": ["PFK y lactato deshidrogenasa", "Succinato deshidrogenasa y citrato sintasa", "Creatina quinasa y ATPasa", "Lipasa y amilasa"], "key": "b", "explanation": "SDH y citrato sintasa (ciclo de Krebs), más altas en entrenados en resistencia.", "tag": ""}, {"id": "2.38", "tema": 2, "q": "Las proteínas como sustrato energético:", "options": ["Son el principal combustible en ejercicio largo", "Se usan poco (inanición) y su rendimiento es difícil de estimar por el coste de excretar nitrógeno", "Dan un RER de 1,0", "No pueden convertirse en glucosa"], "key": "b", "explanation": "Normalmente se ignoran en las estimaciones.", "tag": ""}, {"id": "2.39", "tema": 2, "q": "Al hacer ejercicio, la insulina ______ y las hormonas contrarreguladoras (glucagón, catecolaminas, cortisol) ______:", "options": ["No cambia / bajan", "Baja / suben", "Sube / suben", "Sube / bajan"], "key": "b", "explanation": "Baja la insulina y suben las hormonas que movilizan glucosa y ácidos grasos.", "tag": ""}, {"id": "2.40", "tema": 2, "q": "La fatiga metabólica en esfuerzos cortos e intensos se debe sobre todo a:", "options": ["La deshidratación", "La hipoglucemia", "El agotamiento de la PCr y la acumulación de H⁺ (acidosis)", "El agotamiento del glucógeno hepático"], "key": "c", "explanation": "En esfuerzos largos, en cambio, la fatiga se debe al agotamiento del glucógeno muscular y hepático.", "tag": ""}, {"id": "2.41", "tema": 2, "q": "De la energía liberada en el organismo, aproximadamente:", "options": ["50 % se pierde como calor y 50 % se usa como trabajo", "100 % es calor", "90 % es trabajo", "10 % calor y 90 % trabajo"], "key": "a", "explanation": "Salida de energía ≈ 50 % calor (termorregulación) + 50 % trabajo (membranas, mecánico, químico, almacenamiento).", "tag": ""}, {"id": "3.1", "tema": 3, "q": "[ELIMINATORIO] El VO₂máx se define como:", "options": ["El VO₂ en el umbral anaeróbico", "La cantidad de O₂ consumida en reposo por unidad de tiempo", "La cantidad máxima de O₂ que el organismo es capaz de absorber, transportar y consumir por unidad de tiempo", "El volumen de aire ventilado por minuto"], "key": "c", "explanation": "Definición de Chicharro y Fernández (2006). Es concepto ELIMINATORIO: apréndela literal (absorber, transportar y consumir, por unidad de tiempo).", "tag": "ELIMINATORIO"}, {"id": "3.2", "tema": 3, "q": "[ELIMINATORIO] Para comparar el VO₂máx de un corredor de 55 kg con el de uno de 80 kg conviene expresarlo en:", "options": ["lpm", "L/min", "mL/kg/min", "kcal/min"], "key": "c", "explanation": "El relativo (mL/kg/min) compara sujetos de distinto tamaño y es clave cuando se carga el propio peso (carrera).", "tag": "ELIMINATORIO"}, {"id": "3.3", "tema": 3, "q": "[ELIMINATORIO] El VO₂máx absoluto (L/min) es más adecuado para valorar a deportistas de:", "options": ["Remo, ciclismo o piragüismo, donde no se carga el propio peso", "Escalada", "Salto de altura", "Carrera de fondo"], "key": "a", "explanation": "Sin carga del propio peso, lo que importa es el O₂ total. Lo más correcto sería expresarlo relativo a la masa muscular.", "tag": "ELIMINATORIO"}, {"id": "3.4", "tema": 3, "q": "[ELIMINATORIO] ¿Cuál de estas afirmaciones sobre el VO₂máx es correcta?", "options": ["Es la mejor medida de la aptitud aeróbica, pero no el mejor predictor del rendimiento en resistencia", "Aumenta indefinidamente con el entrenamiento", "Es el mejor predictor del rendimiento en resistencia", "Es igual en hombres y mujeres jóvenes desentrenados"], "key": "a", "explanation": "Con el mismo VO₂máx rinde más quien tiene el umbral más alto y mejor economía.", "tag": "ELIMINATORIO"}, {"id": "3.5", "tema": 3, "q": "[ELIMINATORIO] Con el entrenamiento, el VO₂máx:", "options": ["No cambia nunca", "Sube de forma indefinida", "Se estanca a las 8-12 semanas, pero el rendimiento sigue mejorando porque se compite a un mayor % del VO₂máx", "Baja tras las primeras semanas"], "key": "c", "explanation": "Tras el techo del VO₂máx, el rendimiento mejora por los umbrales y la economía.", "tag": "ELIMINATORIO"}, {"id": "3.6", "tema": 3, "q": "[ELIMINATORIO] Son criterios para considerar alcanzado el VO₂máx:", "options": ["FC de 150 lpm y 6 min de prueba", "Meseta del VO₂, ≥90 % de la FCmáx teórica y RER ≥ 1,15", "RER de 0,85 y lactato de 2 mmol/L", "VO₂ de 3,5 mL/kg/min"], "key": "b", "explanation": "Además, sensación de agotamiento en sujetos experimentados. Meseta = el VO₂ deja de subir aunque suba la carga.", "tag": "ELIMINATORIO"}, {"id": "3.7", "tema": 3, "q": "[ELIMINATORIO] El VO₂máx se identifica en una prueba incremental como:", "options": ["El primer aumento del lactato", "La FC máxima", "El punto en el que el VO₂ no aumenta aunque aumente la intensidad (meseta)", "El punto en que RER = 1,00"], "key": "c", "explanation": "Meseta del VO₂. Si no aparece meseta se habla de VO₂pico.", "tag": "ELIMINATORIO"}, {"id": "3.8", "tema": 3, "q": "[ELIMINATORIO] En sedentarios, el VO₂máx medido en cicloergómetro respecto a cinta suele ser:", "options": ["Un 30 % menor", "Un 6-10 % mayor", "Un 6-10 % menor", "Igual"], "key": "c", "explanation": "En cinta participa más masa muscular. La duración de la fase de ejercicio debe ser 4-6 min (siempre <12 min).", "tag": "ELIMINATORIO"}, {"id": "3.9", "tema": 3, "q": "[ELIMINATORIO] Valores típicos de VO₂máx en jóvenes no entrenados:", "options": ["Hombres 44-50 y mujeres 38-42 mL/kg/min", "Hombres 70-80 y mujeres 60-70", "Hombres 20-25 y mujeres 15-20", "Iguales en ambos sexos"], "key": "a", "explanation": "La diferencia se debe a la menor masa libre de grasa y la menor hemoglobina de la mujer.", "tag": "ELIMINATORIO"}, {"id": "3.10", "tema": 3, "q": "[ELIMINATORIO] Según el ACSM, un VO₂máx inferior a ______ indica discapacidad funcional y enfermedad metabólica:", "options": ["20 mL/kg/min", "30 mL/kg/min", "40 mL/kg/min", "50 mL/kg/min"], "key": "b", "explanation": "<30 mL/kg/min (ACSM).", "tag": "ELIMINATORIO"}, {"id": "3.11", "tema": 3, "q": "[ELIMINATORIO] El mayor VO₂máx registrado en los apuntes (94 mL/kg/min) corresponde a:", "options": ["Maratonianos", "Futbolistas", "Ciclistas", "Esquiadores de fondo"], "key": "d", "explanation": "Esquí de fondo: 94 (hombres) y 75 (mujeres). Corredores ~80, ciclistas ~65.", "tag": "ELIMINATORIO"}, {"id": "3.12", "tema": 3, "q": "[ELIMINATORIO] Un sujeto tiene V̇E = 130 L/min, FIO₂ = 0,21 y FEO₂ = 0,17. Su VO₂ es:", "options": ["2,6 L/min", "5,2 L/min", "22,1 L/min", "27,3 L/min"], "key": "b", "explanation": "Ec. 4: VO₂ = V̇E × (FIO₂ − FEO₂) = 130 × 0,04 = 5,2 L/min. Con 84 kg serían 61,9 mL/kg/min.", "tag": "ELIMINATORIO"}, {"id": "3.13", "tema": 3, "q": "[ELIMINATORIO] Según la ecuación de Fick, el VO₂ es igual a:", "options": ["VS × FR", "FC × volumen corriente", "V̇E × FEO₂", "Gasto cardíaco × diferencia arteriovenosa de O₂"], "key": "d", "explanation": "Ec. 3: VO₂ = Q × dif. a-vO₂ = transporte × extracción. Q = FC × VS.", "tag": "ELIMINATORIO"}, {"id": "3.14", "tema": 3, "q": "[ELIMINATORIO] La masa muscular respecto al VO₂máx:", "options": ["Es uno de sus principales determinantes", "Solo influye en el VO₂ de reposo", "Solo influye en mujeres", "No influye"], "key": "a", "explanation": "Por eso lo más correcto sería expresar el VO₂máx relativo a la masa muscular.", "tag": "ELIMINATORIO"}, {"id": "3.15", "tema": 3, "q": "La transformación de Haldane se basa en que:", "options": ["El O₂ inspirado es igual al espirado", "El volumen de N₂ inspirado es igual al espirado", "La FIO₂ cambia en el ejercicio", "El CO₂ inspirado es igual al espirado"], "key": "b", "explanation": "El N₂ ni se consume ni se produce: V̇I × FIN₂ = V̇E × FEN₂. Permite calcular el V̇I a partir del V̇E.", "tag": ""}, {"id": "3.16", "tema": 3, "q": "El componente lento del VO₂ a altas potencias se atribuye sobre todo a:", "options": ["La mejora de la economía", "La bajada de la temperatura muscular", "La bajada del gasto cardíaco", "Un mayor reclutamiento de fibras tipo II, menos eficientes"], "key": "d", "explanation": "A carga constante alta, el VO₂ sigue subiendo. La deriva del VO₂ es un aumento lento incluso a baja intensidad.", "tag": ""}, {"id": "3.17", "tema": 3, "q": "En la clasificación de Weber, un VO₂pico de 14 mL/kg/min corresponde a la clase:", "options": ["A (nada a ligera)", "B (ligera a moderada)", "C (moderada a severa)", "E (muy grave)"], "key": "c", "explanation": "A >20; B 16-20; C 10-16; D 6-10; E <6.", "tag": ""}, {"id": "3.18", "tema": 3, "q": "Personas sanas sedentarias alcanzan unos ______ MET máximos; entrenadas, hasta ______:", "options": ["20 / 30", "1 / 3", "3-5 / 8", "9-11 / 16"], "key": "d", "explanation": "Sedentario sano 9-11 MET; entrenado hasta 16 MET.", "tag": ""}, {"id": "3.19", "tema": 3, "q": "[CLAVE] El déficit de O₂ es:", "options": ["Una enfermedad pulmonar obstructiva crónica", "El O₂ consumido por encima del reposo tras el ejercicio", "El O₂ necesario para eliminar el lactato", "La diferencia entre el O₂ que requeriría el estado estable y el realmente consumido al inicio del ejercicio"], "key": "d", "explanation": "Al inicio la demanda supera al consumo y la diferencia se cubre con vías anaeróbicas. La adaptación del VO₂ tiene una constante de ~30 s (≈20 s con buen calentamiento).", "tag": "CLAVE"}, {"id": "3.20", "tema": 3, "q": "[CLAVE] El EPOC (exceso de consumo de O₂ postejercicio) sirve para:", "options": ["Aumentar las reservas de grasa", "Reponer ATP/PCr, reconvertir lactato, recargar O₂ en mioglobina y hemoglobina y eliminar CO₂", "Sintetizar proteínas contráctiles", "Bajar la temperatura por debajo del reposo"], "key": "b", "explanation": "Hasta los 80 se llamaba «deuda de O₂»; se cambió porque no se debe solo al déficit inicial.", "tag": "CLAVE"}, {"id": "3.21", "tema": 3, "q": "[CLAVE] El término «deuda de O₂» se sustituyó por EPOC porque:", "options": ["Era una enfermedad", "El consumo extra tras el ejercicio no se debe solo a pagar el déficit inicial", "La deuda solo existe en sedentarios", "El EPOC no existe en ejercicio aeróbico"], "key": "b", "explanation": "También influyen la temperatura, las hormonas y la ventilación.", "tag": "CLAVE"}, {"id": "3.22", "tema": 3, "q": "[CLAVE] Comparando los componentes del EPOC, el componente alactácido:", "options": ["Solo aparece con deudas >5 L", "Se recupera rápido y tiene un T½ corto", "Se recupera lentamente con T½ largo", "Depende de la eliminación del lactato"], "key": "b", "explanation": "Alactácido: O₂ de mioglobina y líquidos y fosfágenos; deuda <5 L. Lactácido: eliminación del lactato, lento, deuda >5 L.", "tag": "CLAVE"}, {"id": "3.23", "tema": 3, "q": "[CLAVE] En un entrenamiento interválico con pausas cortas, lo que da tiempo a recuperar en cada pausa es sobre todo:", "options": ["El glucógeno muscular", "Todo el lactato acumulado", "El componente lactácido", "El componente alactácido (O₂ de la mioglobina y PCr)"], "key": "d", "explanation": "El lactácido (lento) se va acumulando de una serie a otra. La relación esfuerzo/pausa decide qué sistema se entrena.", "tag": "CLAVE"}, {"id": "3.24", "tema": 3, "q": "[CLAVE] Un esfuerzo de alta intensidad y corta duración genera:", "options": ["Poco déficit y poco EPOC", "Ningún EPOC", "Mucho déficit de O₂ y un EPOC grande", "Un EPOC exclusivamente alactácido siempre"], "key": "c", "explanation": "La EPOC depende de intensidad, duración, frecuencia, pausas y carácter del esfuerzo.", "tag": "CLAVE"}, {"id": "3.25", "tema": 3, "q": "[ELIMINATORIO] Según la definición clásica, el umbral aeróbico es:", "options": ["El punto en que el lactato se vuelve exponencial", "Una concentración fija de 4 mmol/L", "El punto en que RER = 1,00", "La intensidad o VO₂ que precede inmediatamente al aumento inicial y continuo del lactato desde los valores de reposo"], "key": "d", "explanation": "Criterio: 0,2-0,5 mmol/L por encima de la línea base. Equivale a VT1 / primer umbral.", "tag": "ELIMINATORIO"}, {"id": "3.26", "tema": 3, "q": "[ELIMINATORIO] El umbral anaeróbico es:", "options": ["El primer aumento del lactato sobre el reposo", "El punto de mínima ventilación", "El punto en que el lactato aumenta de forma exponencial, superando la capacidad de los tampones", "El VO₂máx"], "key": "c", "explanation": "Criterio práctico: segundo incremento consecutivo de 0,5 mmol/L sobre la línea base. Equivale a VT2 / OBLA.", "tag": "ELIMINATORIO"}, {"id": "3.27", "tema": 3, "q": "[ELIMINATORIO] Al superar el umbral anaeróbico la ventilación se dispara porque:", "options": ["El bicarbonato amortigua el H⁺ y produce CO₂ extra no metabólico que estimula la ventilación", "Se agota la PCr", "Baja el CO₂ en sangre", "Aumenta la PO₂ arterial"], "key": "a", "explanation": "H⁺ + HCO₃⁻ ⇄ H₂CO₃ ⇄ CO₂ + H₂O. Si la ventilación no se adapta, el pH cae bruscamente.", "tag": "ELIMINATORIO"}, {"id": "3.28", "tema": 3, "q": "[ELIMINATORIO] En el modelo trifásico de Skinner y McLellan, la fase entre umbrales (fase II) se caracteriza por:", "options": ["Ventilación lineal respecto a la carga", "Lactato >8 mmol/L", "Lactato <1 mmol/L", "Una acumulación lenta y progresiva de lactato, entre 2 y 4 mmol/L"], "key": "d", "explanation": "Fase I hasta VT1; fase II entre umbrales (2-4 mmol/L); fase III por encima de VT2 (>4 mmol/L, exponencial).", "tag": "ELIMINATORIO"}, {"id": "3.29", "tema": 3, "q": "[ELIMINATORIO] En el primer umbral ventilatorio (VT1):", "options": ["Sube V̇E/V̇O₂ sin que suba V̇E/V̇CO₂", "El RER supera 1,15", "Cae la PetCO₂", "Suben a la vez V̇E/V̇O₂ y V̇E/V̇CO₂"], "key": "a", "explanation": "En VT2 empieza a subir también V̇E/V̇CO₂ y cae la PetCO₂.", "tag": "ELIMINATORIO"}, {"id": "3.30", "tema": 3, "q": "[ELIMINATORIO] Un criterio ventilatorio del umbral anaeróbico (VT2) es:", "options": ["El punto más bajo de V̇E/V̇O₂ con V̇E/V̇CO₂ constante", "V̇E/V̇CO₂ empieza a subir cuando V̇E/V̇O₂ ya subía, y la PetCO₂ empieza a caer", "El corte de las rectas del V-slope", "El mínimo del Vd/Vt"], "key": "b", "explanation": "El mínimo de V̇E/V̇O₂, el V-slope y el mínimo del Vd/Vt son criterios del umbral aeróbico (VT1).", "tag": "ELIMINATORIO"}, {"id": "3.31", "tema": 3, "q": "[ELIMINATORIO] El método V-slope (Beaver, 1986) determina el umbral aeróbico a partir de:", "options": ["El cambio de pendiente de V̇CO₂ frente a V̇O₂", "La FC frente a la velocidad", "El RER ≥ 1,00", "El lactato frente a la carga"], "key": "a", "explanation": "Corte de las rectas de regresión de V̇CO₂ frente a V̇O₂.", "tag": "ELIMINATORIO"}, {"id": "3.32", "tema": 3, "q": "[ELIMINATORIO] El concepto OBLA corresponde a:", "options": ["Una concentración fija de lactato de 4 mmol/L, usada para estimar el umbral anaeróbico", "El primer aumento del lactato", "Una concentración fija de 2 mmol/L", "El lactato de reposo"], "key": "a", "explanation": "OBLA = Onset of Blood Lactate Accumulation, 4 mmol/L ≈ UAn. 2 mmol/L se usa para el UAe.", "tag": "ELIMINATORIO"}, {"id": "3.33", "tema": 3, "q": "[ELIMINATORIO] ¿Qué término es sinónimo aproximado del umbral anaeróbico?", "options": ["Línea base de lactato", "Umbral láctico (GET)", "Primer umbral", "Umbral de compensación respiratoria (VT2)"], "key": "d", "explanation": "UAn ≈ VT2, compensación respiratoria, OBLA, IAT, segundo umbral láctico. UAe ≈ VT1, GET, umbral láctico, primer umbral.", "tag": "ELIMINATORIO"}, {"id": "3.34", "tema": 3, "q": "[ELIMINATORIO] El test de Conconi estima el umbral anaeróbico a partir de:", "options": ["El V-slope", "El RER", "El lactato de 4 mmol/L", "El punto de deflexión de la FC"], "key": "d", "explanation": "Útil en el campo, pero discutido fisiológicamente: no aparece en todos los sujetos.", "tag": "ELIMINATORIO"}, {"id": "3.35", "tema": 3, "q": "[ELIMINATORIO] Para determinar umbrales, el protocolo debe tener:", "options": ["Escalones de 10 s", "Escalones de al menos 2 min, incrementos de ~1 MET y carga inicial ≥30 % del VO₂máx", "Incrementos del 30 % del VO₂máx", "Una sola carga constante de 30 min"], "key": "b", "explanation": "Ergómetro específico, incrementos de 1 MET (5-8 % del VO₂máx), sangre arterializada (lóbulo de la oreja o yema del dedo).", "tag": "ELIMINATORIO"}, {"id": "3.36", "tema": 3, "q": "[CLAVE] El MLSS (máximo estado estable de lactato) es:", "options": ["La mayor carga en la que el lactato no aumenta más de 1 mmol/L en los últimos 20 min de un ejercicio de 30 min a carga constante", "Lo mismo que RER = 1,00", "La carga a la que se alcanzan 4 mmol/L en una prueba incremental", "Lo mismo que el VT2"], "key": "a", "explanation": "Definición de Heck (1985). Patrón oro: pruebas en días sucesivos subiendo ~5 % del VO₂máx.", "tag": "CLAVE"}, {"id": "3.37", "tema": 3, "q": "[CLAVE] Según la tesis de Peinado (2009) con ciclistas, la variable más cercana al MLSS es:", "options": ["RER = 1,00", "VT1", "VT2", "El punto medio entre VT1 y VT2"], "key": "d", "explanation": "VT1 lo subestima y VT2 lo sobreestima. Ec. 5: MLSS ≈ (VT1 + VT2) ÷ 2 (el más cercano, no el exacto).", "tag": "CLAVE"}, {"id": "3.38", "tema": 3, "q": "[CLAVE] Un ciclista tiene VT1 a 200 W y VT2 a 300 W. Su MLSS estimado es:", "options": ["150 W", "250 W", "300 W", "200 W"], "key": "b", "explanation": "Ec. 5: (200 + 300) ÷ 2 = 250 W.", "tag": "CLAVE"}, {"id": "3.39", "tema": 3, "q": "[CLAVE] El test de Billat para estimar el MLSS consiste en:", "options": ["Una prueba incremental hasta el agotamiento", "30 s a máxima velocidad", "Varias pruebas en días sucesivos", "2 × 20 min a ~60 % y ~80 % de la velocidad del VO₂máx e interpolar el «incremento cero» de lactato"], "key": "d", "explanation": "Es una alternativa al patrón oro (pruebas en días sucesivos).", "tag": "CLAVE"}, {"id": "3.40", "tema": 3, "q": "Dos deportistas tienen el mismo VO₂máx. Rendirá más en resistencia el que tenga:", "options": ["Menor umbral de lactato", "Mayor % de fibras II", "Peor economía", "Mayor umbral de lactato en % del VO₂máx"], "key": "d", "explanation": "El umbral (y el MLSS) en % del VO₂máx diferencia el rendimiento con igual VO₂máx.", "tag": ""}, {"id": "3.41", "tema": 3, "q": "NO es una característica de los atletas de resistencia de éxito:", "options": ["Alto porcentaje de fibras de tipo II", "VO₂máx alto", "Gran economía de esfuerzo", "Umbral de lactato elevado en % del VO₂máx"], "key": "a", "explanation": "Perfil: VO₂máx alto, umbral alto, buena economía y alto % de fibras tipo I.", "tag": ""}, {"id": "3.42", "tema": 3, "q": "La economía de esfuerzo es:", "options": ["El cociente trabajo/energía", "El % de fibras I", "El VO₂máx relativo", "La energía (VO₂) necesaria para mantener un ritmo dado"], "key": "d", "explanation": "Mejora con la práctica y la técnica y es independiente del VO₂máx.", "tag": ""}, {"id": "3.43", "tema": 3, "q": "Métodos aceptados (aunque imperfectos) para estimar la capacidad anaeróbica:", "options": ["Déficit máximo acumulado de O₂ (MAOD), test de Wingate y potencia crítica", "Harris-Benedict y Mifflin", "Bolsa de Douglas y calorimetría directa", "Test de Cooper y Course Navette"], "key": "a", "explanation": "No hay una medida «oro» de la capacidad anaeróbica como el VO₂máx.", "tag": ""}, {"id": "3.44", "tema": 3, "q": "En esfuerzos aeróbicos de 21-60 min, el determinante principal del rendimiento es:", "options": ["Las reservas de glucógeno solamente", "El sistema ATP-PC", "El VO₂ en el MLSS (% del VO₂máx), la economía y el % de fibras tipo I", "La fuerza máxima"], "key": "c", "explanation": "Powers (2001). En 3-20 min domina el VO₂máx; en 1-4 h se añaden las reservas de glucógeno.", "tag": ""}, {"id": "3.45", "tema": 3, "q": "[CLAVE] Un sujeto tiene FCmáx = 201 lpm y FC de reposo = 67 lpm. Al 65 % por Karvonen, su FC de entrenamiento es:", "options": ["165 lpm", "144 lpm", "154 lpm", "131 lpm"], "key": "c", "explanation": "Ec. 6: (201 − 67) × 0,65 + 67 = 154 lpm. Por el método directo saldría 201 × 0,65 = 131 lpm.", "tag": "CLAVE"}, {"id": "3.46", "tema": 3, "q": "[CLAVE] La diferencia entre el método de Karvonen y el método directo es que:", "options": ["Karvonen subestima la FC de entrenamiento", "Ambos dan el mismo resultado", "El directo usa la FC de reposo", "Karvonen trabaja con la FC de reserva (FCmáx − FCreposo); el directo, solo con un % de la FCmáx y subestima la FC"], "key": "d", "explanation": "El directo se usa en medicina pero subestima notablemente la FC de entrenamiento; en Ciencias del Deporte se usa Karvonen.", "tag": "CLAVE"}, {"id": "3.47", "tema": 3, "q": "[CLAVE] Con FCmáx = 190 y FC reposo = 50, al 70 % por el método directo y por Karvonen salen:", "options": ["148 y 133 lpm", "98 y 148 lpm", "133 y 148 lpm", "133 y 133 lpm"], "key": "c", "explanation": "Directo: 190 × 0,7 = 133. Karvonen: (190 − 50) × 0,7 + 50 = 98 + 50 = 148.", "tag": "CLAVE"}, {"id": "3.48", "tema": 3, "q": "Sobre la fórmula FCmáx = 220 − edad, los apuntes indican que:", "options": ["Solo es válida en deportistas", "Es el método más preciso", "Sobreestima siempre", "Usarla de forma generalizada es un error metodológico; mejor medirla"], "key": "d", "explanation": "Bouzas Marins et al. (2010).", "tag": ""}, {"id": "3.49", "tema": 3, "q": "Según Pollock y Wilmore, una intensidad «moderada» corresponde a:", "options": ["60-79 % de la FCmáx, 50-74 % del VO₂máx o FC de reserva y RPE 12-13", "80-89 % de la FCmáx y RPE 14-16", "35-59 % de la FCmáx y RPE 10-11", "≥90 % de la FCmáx y RPE >16"], "key": "a", "explanation": "Tabla para ejercicio de 20-60 min. 35-59 % FCmáx es «ligera», 80-89 % «dura» y ≥90 % «muy dura».", "tag": ""}, {"id": "3.50", "tema": 3, "q": "[CLAVE] El índice de recuperación de Calderón (Ec. 8) se calcula como:", "options": ["(220 − edad) − FC a los 2′", "(FCmáx − FCreposo) × intensidad + FCreposo", "[(FCmáx alcanzada − FC a los 2′) ÷ (FCmáx − FCreposo)] × 100", "FCmáx × intensidad"], "key": "c", "explanation": "Da un % de recuperación y se puede aplicar a cualquier variable. El resultado se compara con las tablas de percentiles de Lorenzo (2009).", "tag": "CLAVE"}, {"id": "3.51", "tema": 3, "q": "[CLAVE] Un sujeto alcanza 190 lpm, a los 2 min de recuperación tiene 130 lpm y su FC de reposo es 60 lpm. Su índice de Calderón es:", "options": ["60 %", "46 %", "68 %", "32 %"], "key": "b", "explanation": "(190 − 130) ÷ (190 − 60) × 100 = 60 ÷ 130 × 100 = 46,2 %.", "tag": "CLAVE"}, {"id": "3.52", "tema": 3, "q": "Para saber si una recuperación es normal con el índice de Calderón, el resultado se:", "options": ["Compara con las tablas de percentiles por población (Lorenzo, 2009)", "Compara con el VO₂máx", "Compara con la FCmáx teórica", "Multiplica por 1,2"], "key": "a", "explanation": "Las tablas de Lorenzo (2009, UPM) dan percentiles de recuperación.", "tag": ""}, {"id": "4.1", "tema": 4, "q": "[ELIMINATORIO] El MET se define como:", "options": ["La energía necesaria para subir 1 g de agua 1 °C", "El gasto energético total diario", "El cociente VCO₂/VO₂", "La unidad que expresa el gasto de una actividad como múltiplo del gasto en reposo (1 MET = 3,5 mL O₂/kg/min)"], "key": "d", "explanation": "Concepto ELIMINATORIO. Una actividad de 6 MET gasta 6 veces lo que se gasta sentado en reposo.", "tag": "ELIMINATORIO"}, {"id": "4.2", "tema": 4, "q": "[ELIMINATORIO] 1 MET equivale a:", "options": ["1 kcal/min", "3,5 mL O₂/kg/min", "5 kcal/L O₂", "3,5 L O₂/min"], "key": "b", "explanation": "1 MET = 3,5 mL/kg/min ≈ gasto sentado tranquilo (sentado puede llegar a 4 y de pie a 5).", "tag": "ELIMINATORIO"}, {"id": "4.3", "tema": 4, "q": "[ELIMINATORIO] Una actividad de 8 MET significa que:", "options": ["La FC es 8 veces la de reposo", "Se gasta 8 veces la energía del reposo", "Se consumen 8 L de O₂/min", "Se gastan 8 kcal/min"], "key": "b", "explanation": "El MET es un múltiplo del gasto de reposo.", "tag": "ELIMINATORIO"}, {"id": "4.4", "tema": 4, "q": "[ELIMINATORIO] Una persona de 80 kg corre a 10 MET. Su VO₂ es:", "options": ["2,8 L/min", "35 mL/min", "0,28 L/min", "28 L/min"], "key": "a", "explanation": "10 × 3,5 × 80 = 2800 mL/min = 2,8 L/min.", "tag": "ELIMINATORIO"}, {"id": "4.5", "tema": 4, "q": "[ELIMINATORIO] Una persona de 70 kg hace una actividad de 6 MET durante 30 min. Gasta aproximadamente:", "options": ["220 kcal", "73,5 kcal", "735 kcal", "110 kcal"], "key": "a", "explanation": "6 × 3,5 × 70 = 1470 mL/min = 1,47 L/min × 5 kcal/L = 7,35 kcal/min × 30 = 220,5 kcal.", "tag": "ELIMINATORIO"}, {"id": "4.6", "tema": 4, "q": "[ELIMINATORIO] Una persona de 75 kg en reposo (1 MET) gasta al día aproximadamente:", "options": ["945 kcal", "1300 kcal", "1890 kcal", "2600 kcal"], "key": "c", "explanation": "75 × 3,5 = 262,5 mL/min → 0,2625 × 5 = 1,31 kcal/min × 1440 = ~1890 kcal.", "tag": "ELIMINATORIO"}, {"id": "4.7", "tema": 4, "q": "[ELIMINATORIO] Según el ACSM, una actividad de 3-5,9 MET es de intensidad:", "options": ["Moderada", "Sedentaria", "Ligera", "Vigorosa"], "key": "a", "explanation": "Sedentaria ≤1,5; ligera 1,6-2,9; moderada 3-5,9; vigorosa ≥6 MET.", "tag": "ELIMINATORIO"}, {"id": "4.8", "tema": 4, "q": "[ELIMINATORIO] Una actividad de 1,3 MET (estar sentado viendo la televisión) se clasifica como:", "options": ["Sedentaria", "Ligera", "Moderada", "Vigorosa"], "key": "a", "explanation": "≤1,5 MET = conducta sedentaria.", "tag": "ELIMINATORIO"}, {"id": "4.9", "tema": 4, "q": "[ELIMINATORIO] La fórmula práctica para pasar de MET a kcal/min es:", "options": ["MET ÷ 3,5 × peso", "MET × 24,2 × peso", "MET × 3,5 × peso (kg) ÷ 1000 × 5", "MET × peso × 5"], "key": "c", "explanation": "Equivale a ≈ MET × peso × 0,0175 kcal/min.", "tag": "ELIMINATORIO"}, {"id": "4.10", "tema": 4, "q": "[ELIMINATORIO] El Compendio de actividades físicas (Ainsworth; versión de adultos 2024):", "options": ["Calcula la TMB", "Asigna un valor en MET a cada actividad (1114 actividades en 2024)", "Es un cuestionario de AF de 7 días", "Mide la FC de cada actividad"], "key": "b", "explanation": "Ejemplos 2024: bicicleta en general 7,0 MET; estática a 50 W 4,0; competición >20 mph 16,8.", "tag": "ELIMINATORIO"}, {"id": "4.11", "tema": 4, "q": "[ELIMINATORIO] Un dato de 30 min a 6 MET equivale a:", "options": ["3 MET·h", "180 MET·h", "12 MET·h", "0,5 MET·h"], "key": "a", "explanation": "6 MET × 0,5 h = 3 MET·h. La suma diaria de MET·h entre 24 h da el PAL.", "tag": "ELIMINATORIO"}, {"id": "4.12", "tema": 4, "q": "[CLAVE] La calorimetría directa mide:", "options": ["El VO₂ y el VCO₂", "La FC", "El agua doblemente marcada", "El calor producido por el organismo"], "key": "d", "explanation": "En una cámara aislada el calor corporal calienta el agua que circula por las paredes.", "tag": "CLAVE"}, {"id": "4.13", "tema": 4, "q": "Es un inconveniente de la calorimetría directa:", "options": ["No sirve en reposo", "Es muy práctica durante el ejercicio", "Es barata y rápida", "Es cara y lenta, y el sudor y el equipo de ejercicio introducen errores"], "key": "d", "explanation": "Es precisa en reposo, pero no práctica ni precisa en ejercicio.", "tag": ""}, {"id": "4.14", "tema": 4, "q": "La calorimetría indirecta es precisa:", "options": ["En cualquier ejercicio, incluido el supramáximo", "Solo con RER >1,1", "Solo para el metabolismo oxidativo en estado estable", "Solo en esfuerzos anaeróbicos"], "key": "c", "explanation": "Estima el gasto a partir del O₂ consumido y el CO₂ producido.", "tag": ""}, {"id": "4.15", "tema": 4, "q": "La técnica que mide el gasto energético total en vida libre durante días con isótopos ²H y ¹⁸O es:", "options": ["La calorimetría directa", "El IPAQ", "La espirometría de circuito cerrado", "El agua doblemente marcada"], "key": "d", "explanation": "Agua doblemente marcada.", "tag": ""}, {"id": "4.16", "tema": 4, "q": "De la energía de los sustratos, aproximadamente:", "options": ["90 % va a ATP", "40 % va a ATP y 60 % se pierde como calor", "60 % a ATP y 40 % calor", "100 % es calor"], "key": "b", "explanation": "Por eso el calor producido refleja el gasto energético.", "tag": ""}, {"id": "4.17", "tema": 4, "q": "[CLAVE] El RER (cociente de intercambio respiratorio) se calcula como:", "options": ["V̇E ÷ V̇O₂", "V̇CO₂ ÷ V̇O₂", "V̇O₂ ÷ V̇CO₂", "V̇O₂ × V̇CO₂"], "key": "b", "explanation": "RER = V̇CO₂/V̇O₂. Predice el sustrato usado y las kcal por litro de O₂.", "tag": "CLAVE"}, {"id": "4.18", "tema": 4, "q": "[CLAVE] El RER de la oxidación de la glucosa y del ácido palmítico es, respectivamente:", "options": ["0,70 y 1,00", "0,85 y 0,85", "0,80 y 0,70", "1,00 y 0,70"], "key": "d", "explanation": "Glucosa: 6 CO₂/6 O₂ = 1,00. Palmítico: 16 CO₂/23 O₂ = 0,70.", "tag": "CLAVE"}, {"id": "4.19", "tema": 4, "q": "[CLAVE] Con un RER de 0,85, la mezcla aproximada de sustratos es:", "options": ["~50 % CH y ~50 % grasas", "100 % grasas", "100 % CH", "84 % CH y 16 % grasas"], "key": "a", "explanation": "Tabla 5.1: RER 0,85 → 51 % CH, 49 % grasas, 4,86 kcal/L O₂.", "tag": "CLAVE"}, {"id": "4.20", "tema": 4, "q": "[CLAVE] Influencia del RER en el gasto energético: para el mismo VO₂, un RER más alto implica:", "options": ["Menos kcal por litro de O₂", "Solo cambia la FC", "Algo más de kcal por litro de O₂ (de 4,69 con RER 0,71 a 5,05 con RER 1,00)", "Las mismas kcal"], "key": "c", "explanation": "Quemar CH rinde algo más energía por litro de O₂ que quemar grasa.", "tag": "CLAVE"}, {"id": "4.21", "tema": 4, "q": "[CLAVE] Un RER superior a 1,0 durante el ejercicio intenso se explica por:", "options": ["La exhalación extra de CO₂ procedente del tamponamiento de H⁺ (lactato) por el bicarbonato", "La oxidación exclusiva de grasas", "La gluconeogénesis", "La oxidación de proteínas"], "key": "a", "explanation": "El CO₂ extra no metabólico eleva el RER por encima de 1.", "tag": "CLAVE"}, {"id": "4.22", "tema": 4, "q": "[CLAVE] Un RER inferior a 0,70 puede deberse a:", "options": ["El ejercicio supramáximo", "La gluconeogénesis", "La acumulación de lactato", "La hiperventilación"], "key": "b", "explanation": "Limitaciones de la calorimetría indirecta: gluconeogénesis → RER <0,70; RER no sirve para proteínas.", "tag": "CLAVE"}, {"id": "4.23", "tema": 4, "q": "[CLAVE] En reposo, el RER típico es de:", "options": ["~1,00", "~0,70", "~0,80", "~1,15"], "key": "c", "explanation": "Reposo: RER ≈ 0,80, VO₂ ≈ 0,3 L/min → unas 2000 kcal/día.", "tag": "CLAVE"}, {"id": "4.24", "tema": 4, "q": "Según los equivalentes de los apuntes, 1 L de O₂ equivale aproximadamente a:", "options": ["5 kcal y 2134 kgm", "9,3 kcal", "1 kcal y 427 kgm", "4,1 kcal"], "key": "a", "explanation": "1 kcal = 426,8 kgm. 1 L O₂ ≈ 5 kcal ≈ 2134 kgm.", "tag": ""}, {"id": "4.25", "tema": 4, "q": "El contenido energético de 1 g de lípidos y de 1 g de carbohidratos es, respectivamente:", "options": ["9,3 y 7 kcal", "9,3 y 4,1 kcal", "7,7 y 4,1 kcal", "4,1 y 9,3 kcal"], "key": "b", "explanation": "CH 4,1; proteínas ~4,1; lípidos ~9,3 kcal/g. 1 g de peso corporal perdido ≈ 7,7 kcal.", "tag": ""}, {"id": "4.26", "tema": 4, "q": "1 kJ equivale a:", "options": ["238,85 kcal", "0,239 kcal", "1000 kcal", "4,18 kcal"], "key": "b", "explanation": "Equiv. 7: 1 kJ = 0,239 kcal (1 kcal = 4,18 kJ). 238,85 kcal = 1 MJ.", "tag": ""}, {"id": "4.27", "tema": 4, "q": "Una de las condiciones para medir la tasa metabólica basal es:", "options": ["A 30 °C de temperatura ambiente", "Sentado tras un calentamiento", "Tras 8 h de sueño y 12 h de ayuno, en decúbito supino y ambiente termoneutral", "Justo después de comer"], "key": "c", "explanation": "Además sin emociones ni estrés. La RMR es similar (±5-10 %) con condiciones menos estrictas.", "tag": ""}, {"id": "4.28", "tema": 4, "q": "Con la edad, desde los ~25 años, la tasa metabólica en reposo:", "options": ["No cambia", "Baja un 20 % por década", "Sube un 2-5 % por década", "Baja un 2-5 % por década"], "key": "d", "explanation": "Además en la mujer es un 5-10 % menor.", "tag": ""}, {"id": "4.29", "tema": 4, "q": "¿Cuál de estos factores NO aumenta la tasa metabólica en reposo?", "options": ["El estrés", "La pérdida de masa libre de grasa", "El embarazo y la lactancia", "El aumento de tiroxina y adrenalina"], "key": "b", "explanation": "La TMB se relaciona con la masa libre de grasa: si baja, baja la TMB.", "tag": ""}, {"id": "4.30", "tema": 4, "q": "[CLAVE] La ecuación de Harris-Benedict sirve para:", "options": ["Calcular el PAL", "Estimar la tasa metabólica basal (RMB) a partir del peso, la talla, la edad y el sexo", "Estimar la FC máxima", "Calcular el VO₂máx"], "key": "b", "explanation": "Hombres: 66,473 + 13,751·peso + 5,0033·talla − 6,775·edad. Mujeres: 655,1 + 9,563·peso + 1,850·talla − 4,676·edad. Talla en cm.", "tag": "CLAVE"}, {"id": "4.31", "tema": 4, "q": "[CLAVE] En la ecuación de Harris-Benedict, la talla debe ir en:", "options": ["Pulgadas", "Milímetros", "Centímetros", "Metros"], "key": "c", "explanation": "El formulario dice «m», pero con esos coeficientes va en cm (con metros sale cientos de kcal menos).", "tag": "CLAVE"}, {"id": "4.32", "tema": 4, "q": "La ecuación rápida de la RMB para un hombre de 80 kg da:", "options": ["1760 kcal/día", "2400 kcal/día", "1936 kcal/día", "1000 kcal/día"], "key": "c", "explanation": "Ec. 10: 24,2 × 80 = 1936 kcal. En mujeres: 22 × peso.", "tag": ""}, {"id": "4.33", "tema": 4, "q": "Una persona con RMB de 1700 kcal que entrena 3-5 días por semana (moderado) tiene un GETD de:", "options": ["2635 kcal", "2933 kcal", "2040 kcal", "3230 kcal"], "key": "a", "explanation": "1700 × 1,55 = 2635. Factores: 1,2 / 1,375 / 1,55 / 1,725 / 1,9.", "tag": ""}, {"id": "4.34", "tema": 4, "q": "Una desviación del metabolismo basal (DRMB) se considera anormal a partir de:", "options": ["Cualquier valor positivo", "+10 %", "+5 %", "Más del +20 %"], "key": "d", "explanation": "Hasta +15 % es aceptable en el hospital; más del +20 % es anormal.", "tag": ""}, {"id": "4.35", "tema": 4, "q": "[CLAVE] En un sedentario, el componente mayoritario del gasto energético diario es:", "options": ["La actividad física", "El efecto térmico de los alimentos", "La tasa metabólica basal/en reposo (60-80 %)", "La NEAT"], "key": "c", "explanation": "TMB 60-80 % (típico 65-70 %), TEF 5-10 %, AF 10-30 %.", "tag": "CLAVE"}, {"id": "4.36", "tema": 4, "q": "[CLAVE] El componente más variable del gasto energético diario y el que más puede aumentarlo es:", "options": ["La actividad física (ejercicio + NEAT)", "La TMB", "La termorregulación", "El efecto térmico de los alimentos"], "key": "a", "explanation": "En deportistas la AF llega al 40-58 % del gasto.", "tag": "CLAVE"}, {"id": "4.37", "tema": 4, "q": "[CLAVE] El efecto térmico de los alimentos supone aproximadamente:", "options": ["40-50 %", "25-30 %", "5-10 % del gasto diario", "60-80 %"], "key": "c", "explanation": "TEF (acción dinámica específica) 5-10 % en sedentarios y deportistas.", "tag": "CLAVE"}, {"id": "4.38", "tema": 4, "q": "[CLAVE] El PAL (nivel de actividad física) es:", "options": ["El gasto del ejercicio en kcal", "El VO₂máx en MET", "El MET máximo alcanzado", "La media de METs del día (suma de MET × horas de cada actividad ÷ 24 h)"], "key": "d", "explanation": "Se convierte en el coeficiente PA de las ecuaciones de la FNB (2005) para estimar el TEE.", "tag": "CLAVE"}, {"id": "4.39", "tema": 4, "q": "[CLAVE] El IPAQ es:", "options": ["Un acelerómetro", "Un cuestionario de autoinforme de la AF de los últimos 7 días que estima el gasto en MET·min/semana y clasifica el nivel de AF", "Un test de esfuerzo incremental", "Una ecuación de la TMB"], "key": "b", "explanation": "Clasifica en nivel bajo, moderado o alto. Barato y rápido, pero menos preciso que los métodos objetivos.", "tag": "CLAVE"}, {"id": "4.40", "tema": 4, "q": "[CLAVE] Según la OMS (2010), una persona es sedentaria cuando:", "options": ["Pasa más de 360 min/día en conductas sedentarias", "Su VO₂máx es <30 mL/kg/min", "No practica deporte federado", "Hace menos de 150 min/semana de AF moderada-vigorosa"], "key": "a", "explanation": "<150 min/semana de AF moderada-vigorosa es la definición de INACTIVO. Se puede ser activo y sedentario a la vez.", "tag": "CLAVE"}, {"id": "4.41", "tema": 4, "q": "[CLAVE] Una persona que hace menos de 150 min/semana de AF moderada-vigorosa (o <75 min de vigorosa) es:", "options": ["Inactiva", "Sedentaria-activa", "Sedentaria", "Muy activa"], "key": "a", "explanation": "Inactivo ≠ sedentario. Sedentario = >360 min/día sentado.", "tag": "CLAVE"}, {"id": "4.42", "tema": 4, "q": "La eficiencia neta se calcula como:", "options": ["W biológico ÷ W mecánico × 100", "W mecánico ÷ (W biológico − W reposo) × 100", "W mecánico ÷ W biológico × 100", "VO₂ ÷ velocidad"], "key": "b", "explanation": "La eficiencia bruta no resta el reposo. La economía es la energía necesaria para mantener una velocidad.", "tag": ""}, {"id": "4.43", "tema": 4, "q": "Según la ecuación ACSM de carrera en llano, a 200 m/min el VO₂ es:", "options": ["40 mL/kg/min", "43,5 mL/kg/min", "73,5 mL/kg/min", "23,5 mL/kg/min"], "key": "b", "explanation": "VO₂ = 3,5 + 0,2 × v = 3,5 + 40 = 43,5 mL/kg/min (marcha: 3,5 + 0,1 × v).", "tag": ""}, {"id": "4.44", "tema": 4, "q": "La disponibilidad energética (EA) se calcula como:", "options": ["(Ingesta − gasto del entrenamiento) ÷ masa libre de grasa", "Gasto ÷ ingesta", "Ingesta − gasto total", "Ingesta ÷ peso"], "key": "a", "explanation": "Ec. 20. EA <30 kcal/kg FFM/día = riesgo para la salud (RED-S, trastornos de la conducta alimentaria).", "tag": ""}, {"id": "4.45", "tema": 4, "q": "Una deportista de 60 kg con 20 % de grasa ingiere 2800 kcal y gasta 900 kcal entrenando. Su EA es:", "options": ["31,7 kcal/kg/día", "46,7 kcal/kg/día", "39,6 kcal/kg FFM/día", "58,3 kcal/kg/día"], "key": "c", "explanation": "FFM = 48 kg. (2800 − 900) ÷ 48 = 39,6 kcal/kg FFM/día (por encima del límite de riesgo de 30).", "tag": ""}, {"id": "4.46", "tema": 4, "q": "El modelo de gasto «restringido» o adaptativo (Pontzer) propone que:", "options": ["El gasto sube en proporción exacta a la AF", "Al aumentar la AF, otros componentes se compensan y el gasto total sube menos de lo esperado", "La TMB no cambia nunca", "El TEF es el componente principal"], "key": "b", "explanation": "Frente al modelo clásico aditivo (+10 % de AF → +10 % de gasto).", "tag": ""}, {"id": "4.47", "tema": 4, "q": "El método de valoración de la ingesta más fiable pero más caro es:", "options": ["La dieta duplicada (análisis químico)", "El registro de compras", "El recordatorio de 24 h", "El IPAQ"], "key": "a", "explanation": "El recordatorio de 24 h es muy rápido, pero un solo día representa mal la dieta habitual.", "tag": ""}, {"id": "5.1", "tema": 5, "q": "[CLAVE] La capacidad de un músculo o grupo muscular para repetir contracciones de alta intensidad o mantener un ejercicio estático se llama:", "options": ["Economía de esfuerzo", "Capacidad aeróbica máxima", "Resistencia cardiorrespiratoria", "Resistencia muscular"], "key": "d", "explanation": "Resistencia muscular: ligada a la fuerza y a la capacidad anaeróbica. La cardiorrespiratoria es la de todo el cuerpo en ejercicios largos y dinámicos.", "tag": "CLAVE"}, {"id": "5.2", "tema": 5, "q": "[CLAVE] La resistencia cardiorrespiratoria se define como:", "options": ["La fuerza máxima", "La capacidad de todo el cuerpo para mantener ejercicios estables de larga duración, prolongados y dinámicos", "La capacidad de un músculo para repetir contracciones", "La capacidad anaeróbica"], "key": "b", "explanation": "Está relacionada con la capacidad cardíaca y respiratoria (aeróbica). Su máximo es el VO₂máx.", "tag": "CLAVE"}, {"id": "5.3", "tema": 5, "q": "[CLAVE] La capacidad máxima de resistencia cardiorrespiratoria se mide con:", "options": ["La fuerza isométrica", "La FC de reposo", "El VO₂máx", "El Wingate"], "key": "c", "explanation": "La capacidad submáxima se ve en que, tras entrenar, la FC es menor a la misma intensidad submáxima.", "tag": "CLAVE"}, {"id": "5.4", "tema": 5, "q": "¿Cuál de estas es una prueba de campo para evaluar la capacidad aeróbica?", "options": ["Prueba en rampa con ergoespirometría", "Course Navette", "Protocolo de Balke", "Protocolo de Bruce"], "key": "b", "explanation": "De campo: Conconi, Course Navette, distancia fija, Universidad de Montreal. Bruce, Balke y rampa son de laboratorio.", "tag": ""}, {"id": "5.5", "tema": 5, "q": "[CLAVE] El término en inglés del volumen sistólico es:", "options": ["Stroke volume", "Ejection fraction", "Cardiac output", "Heart rate"], "key": "a", "explanation": "Stroke volume (SV): sangre bombeada en cada latido (mL/latido).", "tag": "CLAVE"}, {"id": "5.6", "tema": 5, "q": "[CLAVE] «Cardiac output» es:", "options": ["La fracción de eyección", "El gasto cardíaco: sangre que bombea el ventrículo izquierdo en un minuto (Q = VS × FC)", "El volumen sistólico", "La presión arterial"], "key": "b", "explanation": "Cardiac output = gasto cardíaco.", "tag": "CLAVE"}, {"id": "5.7", "tema": 5, "q": "[CLAVE] La fracción de eyección (ejection fraction) es:", "options": ["La proporción de sangre expulsada del ventrículo respecto a toda la que cabe en él", "La sangre que llega a cada territorio", "La presión sobre las paredes arteriales", "El volumen total de sangre"], "key": "a", "explanation": "FE = VS ÷ VDF × 100. Por debajo del 50 % se considera patológica.", "tag": "CLAVE"}, {"id": "5.8", "tema": 5, "q": "[CLAVE] Un ventrículo tiene un volumen diastólico final de 120 mL y un volumen sistólico final de 50 mL. Su fracción de eyección es:", "options": ["240 %", "42 %", "58 %", "70 %"], "key": "c", "explanation": "VS = 120 − 50 = 70 mL. FE = 70 ÷ 120 × 100 = 58,3 %.", "tag": "CLAVE"}, {"id": "5.9", "tema": 5, "q": "[CLAVE] El término «blood volume» corresponde a:", "options": ["El volumen sanguíneo total (plasma + células)", "El flujo sanguíneo", "La presión arterial", "El volumen plasmático"], "key": "a", "explanation": "Plasma volume = volumen plasmático; blood flow = flujo; blood pressure = presión arterial.", "tag": "CLAVE"}, {"id": "5.10", "tema": 5, "q": "[CLAVE] Un deportista tiene una FC de 60 lpm y un VS de 90 mL. Su gasto cardíaco es:", "options": ["150 mL/min", "1,5 L/min", "5,4 L/min", "54 L/min"], "key": "c", "explanation": "Q = VS × FC = 90 × 60 = 5400 mL/min = 5,4 L/min.", "tag": "CLAVE"}, {"id": "5.11", "tema": 5, "q": "[CLAVE] El entrenamiento aeróbico produce en el corazón una hipertrofia:", "options": ["Patológica con fibrosis", "Ninguna", "Excéntrica: sobrecarga de volumen, dilatación de la cavidad del VI", "Concéntrica: más grosor de pared sin dilatar"], "key": "c", "explanation": "Aeróbico → excéntrica (cavidad). Fuerza → concéntrica (pared). Ninguna produce fibrosis ni disfunción.", "tag": "CLAVE"}, {"id": "5.12", "tema": 5, "q": "[CLAVE] El entrenamiento de fuerza produce en el corazón una hipertrofia:", "options": ["Del ventrículo derecho exclusivamente", "Excéntrica: dilatación de la cavidad", "Concéntrica: sobrecarga de presión, más grosor de pared sin dilatar la cavidad", "Con fibrosis y disfunción"], "key": "c", "explanation": "Miocitos más anchos, sin fibrosis.", "tag": "CLAVE"}, {"id": "5.13", "tema": 5, "q": "[CLAVE] Sobre la hipótesis «el deporte de resistencia agranda la cavidad y el de fuerza engrosa la pared», los datos de Fagard (1996) indican que:", "options": ["Se confirma en parte: los de resistencia también engrosan la pared (los ciclistas incluso más que los de fuerza) y son los que más masa ganan", "Es falsa: la fuerza agranda más la cavidad", "Se confirma totalmente", "El corazón no cambia con el deporte"], "key": "a", "explanation": "Ciclistas: +10 % diámetro, +30 % grosor, +63 % masa. Fuerza: +2 %, +15 %, +25 %.", "tag": "CLAVE"}, {"id": "5.14", "tema": 5, "q": "[CLAVE] Según Fagard, el grupo que más aumenta la masa del ventrículo izquierdo frente a sedentarios es:", "options": ["Atletas de fuerza", "Ninguno, todos igual", "Ciclistas", "Corredores"], "key": "c", "explanation": "Ciclistas ≈ +63 %, corredores ≈ +48 %, fuerza ≈ +25 %.", "tag": "CLAVE"}, {"id": "5.15", "tema": 5, "q": "Con el entrenamiento de resistencia, el volumen sistólico:", "options": ["No cambia", "Aumenta en reposo, en submáximo y en máximo", "Disminuye", "Solo aumenta en máximo"], "key": "b", "explanation": "No entrenado: 50-70 mL en reposo y 80-110 en máximo; muy entrenado: 90-110 y 150-220+.", "tag": ""}, {"id": "5.16", "tema": 5, "q": "Con el entrenamiento de resistencia, el gasto cardíaco:", "options": ["No cambia en ningún caso", "Apenas cambia en reposo y submáximo, pero el Q máximo aumenta mucho", "Aumenta mucho en reposo", "Disminuye en máximo"], "key": "b", "explanation": "El mayor VS permite el mismo Q con menos FC; el Q máximo sube gracias al mayor VS.", "tag": ""}, {"id": "5.17", "tema": 5, "q": "Con el entrenamiento aeróbico, la FC máxima:", "options": ["No cambia de forma significativa (baja con la edad)", "Baja mucho", "Se duplica", "Aumenta mucho"], "key": "a", "explanation": "La FC de reposo y la submáxima bajan; la máxima no cambia.", "tag": ""}, {"id": "5.18", "tema": 5, "q": "La bajada de la FC de reposo con el entrenamiento se debe a:", "options": ["Un aumento de la actividad simpática", "La bajada del VS", "Un aumento de la actividad parasimpática y una disminución de la simpática", "La pérdida de volumen plasmático"], "key": "c", "explanation": "Baja ~1 lpm por semana de entrenamiento.", "tag": ""}, {"id": "5.19", "tema": 5, "q": "La recuperación de la FC tras el ejercicio con el entrenamiento:", "options": ["Es más lenta", "No cambia", "Solo depende de la edad", "Es más rápida; es un índice indirecto de aptitud"], "key": "d", "explanation": "La altitud y el calor la alargan. Para comparar entre sujetos se usa un índice relativo como el de Calderón.", "tag": ""}, {"id": "5.20", "tema": 5, "q": "[CLAVE] La deriva cardiovascular («cardiovascular drift/drive») es:", "options": ["La FC máxima alcanzada", "La bajada de la FC durante el ejercicio", "En ejercicio submáximo largo, la subida progresiva de la FC con bajada del VS, manteniendo el Q", "El aumento del VS en esfuerzos cortos"], "key": "c", "explanation": "Aparece en ejercicios de 30-90 min con agotamiento de sustratos e hidratación irregular.", "tag": "CLAVE"}, {"id": "5.21", "tema": 5, "q": "[CLAVE] La causa de la deriva cardiovascular es:", "options": ["La caída del lactato", "La pérdida de volumen circulante (sudor) y el envío de sangre a la piel, que reducen el llenado y el VS", "La hipertrofia cardíaca", "El aumento del volumen plasmático"], "key": "b", "explanation": "Menos llenado → ↓VS → ↑FC para mantener el mismo Q.", "tag": "CLAVE"}, {"id": "5.22", "tema": 5, "q": "[CLAVE] Respecto a la pendiente de la relación FC/intensidad:", "options": ["Aumenta con el entrenamiento", "Es igual en todos", "Es menor en entrenados y en hombres; mayor en no entrenados y en mujeres", "Es mayor en entrenados"], "key": "c", "explanation": "El entrenamiento reduce la pendiente. Con brazos la FC es mayor para el mismo VO₂.", "tag": "CLAVE"}, {"id": "5.23", "tema": 5, "q": "[CLAVE] Un mismo sujeto, tras varios meses de entrenamiento aeróbico, en la relación FC/intensidad:", "options": ["Pierde la linealidad", "Mantiene la misma pendiente", "Disminuye su pendiente", "Aumenta su pendiente"], "key": "c", "explanation": "A la misma intensidad la FC es menor.", "tag": "CLAVE"}, {"id": "5.24", "tema": 5, "q": "En reposo, el porcentaje del gasto cardíaco que va a los músculos es de ______ y en ejercicio puede llegar al ______:", "options": ["80 % / 100 %", "15-20 % / 85 %", "50 % / 60 %", "5 % / 20 %"], "key": "b", "explanation": "Redistribución del flujo: parte va a la piel para eliminar calor y algunas vísceras se cierran.", "tag": ""}, {"id": "5.25", "tema": 5, "q": "[CLAVE] El hematocrito es:", "options": ["El número de leucocitos", "El porcentaje del volumen de sangre ocupado por los glóbulos rojos", "El volumen plasmático", "La concentración de hemoglobina"], "key": "b", "explanation": "Hematocrito = volumen eritrocitario ÷ volemia × 100. ≥50 % indica una formación anormal (o dopaje).", "tag": "CLAVE"}, {"id": "5.26", "tema": 5, "q": "[CLAVE] La pseudoanemia del deportista consiste en:", "options": ["Un hematocrito bajo porque el plasma aumenta más que los glóbulos rojos, sin anemia real", "Una pérdida real de glóbulos rojos", "Un déficit de hierro", "Un hematocrito superior al 50 %"], "key": "a", "explanation": "El volumen plasmático sube ~25 %. Es una dilución, no una falta de hemoglobina.", "tag": "CLAVE"}, {"id": "5.27", "tema": 5, "q": "[CLAVE] El aumento del volumen plasmático con el entrenamiento se debe sobre todo a:", "options": ["El sistema renina-angiotensina-aldosterona y la ADH, junto con más proteínas plasmáticas", "La insulina", "La EPO exclusivamente", "La deshidratación"], "key": "a", "explanation": "El ejercicio largo primero reduce el plasma (hemoconcentración) y después se produce una supercompensación.", "tag": "CLAVE"}, {"id": "5.28", "tema": 5, "q": "[CLAVE] Un sujeto tiene una volemia de 5 L con hematocrito del 43 %. Su volumen plasmático es:", "options": ["2,85 L", "4,57 L", "2,15 L", "0,43 L"], "key": "a", "explanation": "Volumen eritrocitario = 5 × 0,43 = 2,15 L; VP = 5 − 2,15 = 2,85 L.", "tag": "CLAVE"}, {"id": "5.29", "tema": 5, "q": "Con el entrenamiento aeróbico, la viscosidad de la sangre:", "options": ["Se duplica", "Disminuye, lo que mejora la circulación y el intercambio de gases", "Aumenta", "No cambia"], "key": "b", "explanation": "Más plasma → menor viscosidad. El aumento del VP se correlaciona con el del VS y el del VO₂máx.", "tag": ""}, {"id": "5.30", "tema": 5, "q": "Tras el ejercicio, el número de leucocitos:", "options": ["Disminuye", "No cambia", "Aumenta, sobre todo con el ejercicio corto e intenso, y vuelve a reposo en ~24 h", "Aumenta durante semanas"], "key": "c", "explanation": "Causas: arrastre por el mayor flujo, adrenalina y cortisol, inflamación por microtraumatismos.", "tag": ""}, {"id": "5.31", "tema": 5, "q": "En reposo, la relación ventilación/perfusión (V̇E/Q) es de aproximadamente:", "options": ["0,8", "1,5", "4", "0,2"], "key": "a", "explanation": "V̇E alveolar ≈ 4,2 L/min y Q ≈ 5 L/min. En ejercicio intenso llega a ~4-5.", "tag": ""}, {"id": "5.32", "tema": 5, "q": "En un mediofondista, la V̇E sube ~28 veces del reposo al máximo y el Q solo ~6 veces. Esto indica que el factor más limitante del rendimiento aeróbico es:", "options": ["La difusión pulmonar", "La ventilación", "El cardíaco (gasto cardíaco)", "La FR"], "key": "c", "explanation": "En sanos la V̇E máxima no llega a la ventilación voluntaria máxima.", "tag": ""}, {"id": "5.33", "tema": 5, "q": "A alta intensidad, la ventilación aumenta sobre todo por:", "options": ["La frecuencia respiratoria (el volumen corriente se estanca hacia el 60-70 %)", "El volumen corriente", "La PO₂ arterial", "El espacio muerto"], "key": "a", "explanation": "V̇E = VC × FR. A baja intensidad sube sobre todo el VC.", "tag": ""}, {"id": "5.34", "tema": 5, "q": "El aumento inmediato de la ventilación al empezar el ejercicio, incluso antes de la contracción, se debe a:", "options": ["Los quimiorreceptores por el CO₂", "La temperatura", "El mando central (respuesta anticipada)", "La acidosis"], "key": "c", "explanation": "La segunda fase (gradual) depende de los cambios químicos de la sangre (CO₂ y H⁺).", "tag": ""}, {"id": "5.35", "tema": 5, "q": "El aumento de PCO₂ y de temperatura desplaza la curva de disociación de la hemoglobina:", "options": ["No la modifica", "A la izquierda: retiene más O₂", "A la derecha: la hemoglobina cede más O₂ al músculo", "Hacia arriba"], "key": "c", "explanation": "Efecto favorable en el músculo activo.", "tag": ""}, {"id": "5.36", "tema": 5, "q": "[CLAVE]
