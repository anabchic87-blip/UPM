 ¿Existe un «drive ventilatorio» en el ejercicio submáximo intenso?", "options": ["No: la V̇E siempre se estabiliza", "Sí: la V̇E no se estabiliza y sigue subiendo aunque la carga sea constante", "Solo en sedentarios", "Solo en ejercicio máximo"], "key": "b", "explanation": "Equivalente respiratorio de la deriva cardiovascular, por H⁺, CO₂, temperatura y catecolaminas. En el submáximo ligero la V̇E sí se estabiliza.", "tag": "CLAVE"}, {"id": "5.37", "tema": 5, "q": "[CLAVE] ¿El entrenamiento aeróbico adapta la ventilación?", "options": ["Sí: ↑ fuerza de los músculos respiratorios, ↑ V̇E máxima y ↓ V̇E submáxima por menor sensibilidad al CO₂", "Solo baja la V̇E máxima", "No, la ventilación no se entrena", "Solo aumenta la V̇E en reposo"], "key": "a", "explanation": "4 semanas bastan para ver cambios en los equivalentes ventilatorios; 5 meses, una bajada clara de la V̇E submáxima.", "tag": "CLAVE"}, {"id": "5.38", "tema": 5, "q": "El flato (dolor agudo bajo el pecho) se ha relacionado con:", "options": ["La deshidratación", "Una posible isquemia de los músculos respiratorios, en no entrenados o tras comidas copiosas", "El ácido láctico", "La hiperventilación crónica"], "key": "b", "explanation": "Se ha descartado el ácido láctico como causa.", "tag": ""}, {"id": "5.39", "tema": 5, "q": "[CLAVE] El efecto principal del entrenamiento aeróbico a largo plazo, además de subir el VO₂máx, es:", "options": ["Aumentar la FC máxima", "Bajar el volumen sistólico", "Aumentar la V̇E submáxima", "Mejorar la posición del MLSS (el umbral pasa a un % mayor del VO₂máx)"], "key": "d", "explanation": "El ritmo de carrera es directamente proporcional al VO₂ en el MLSS.", "tag": "CLAVE"}, {"id": "5.40", "tema": 5, "q": "La herencia explica aproximadamente ______ de la variación del VO₂máx:", "options": ["El 25-50 %", "El 90 %", "El 100 %", "El 5 %"], "key": "a", "explanation": "Fija un rango finito de VO₂máx; los gemelos idénticos se parecen más que los fraternos.", "tag": ""}, {"id": "5.41", "tema": 5, "q": "En el HERITAGE Family Study, con el mismo programa, la mejora del VO₂máx fue:", "options": ["Igual en todos (20 %)", "Negativa en la mitad", "Del 50 al 100 %", "Del 0 al 43 % (respondedores altos y bajos)"], "key": "d", "explanation": "Mecanismos: gasto cardíaco, volumen sanguíneo y extracción de O₂.", "tag": ""}, {"id": "5.42", "tema": 5, "q": "El VO₂máx de la mujer no entrenada respecto al hombre no entrenado es:", "options": ["Un 50 % menor", "Un 10 % mayor", "Igual", "Un 20-25 % menor (entre entrenados ~10 %)"], "key": "d", "explanation": "La diferencia se reduce entre entrenados.", "tag": ""}, {"id": "5.43", "tema": 5, "q": "Sobre la edad y la mejora aeróbica:", "options": ["Solo mejoran los menores de 30", "Influye mucho más la intensidad del entrenamiento que la edad", "Las mejoras son mayores con la edad", "La edad impide cualquier mejora"], "key": "b", "explanation": "Tendencia a la baja a partir de los 50 años.", "tag": ""}, {"id": "5.44", "tema": 5, "q": "Sobre el entrenamiento cruzado:", "options": ["El de resistencia merma las ganancias de fuerza; el de fuerza no merma las de resistencia", "Ninguno interfiere", "Ambos se anulan", "El de fuerza merma las de resistencia"], "key": "a", "explanation": "Especificidad: el VO₂máx es mayor en el gesto específico del deporte.", "tag": ""}, {"id": "5.45", "tema": 5, "q": "La mejora relativa del VO₂máx con el entrenamiento es mayor en:", "options": ["El sedentario", "Los mayores de 70 años", "Ambos por igual", "El muy entrenado"], "key": "a", "explanation": "Cuanto más alto el nivel previo, menor margen de mejora.", "tag": ""}, {"id": "5.46", "tema": 5, "q": "[CLAVE] Un modelo de rendimiento es:", "options": ["Un esquema jerárquico que relaciona el rendimiento con las capacidades funcionales y los componentes morfológicos que lo determinan", "Una ecuación para calcular el VO₂máx", "Un tipo de periodización", "Un test de campo"], "key": "a", "explanation": "Sirve para saber qué evaluar y qué entrenar (ejemplo de Wilmore y Costill; ciclismo de Hawley y Stepto).", "tag": "CLAVE"}, {"id": "5.47", "tema": 5, "q": "[CLAVE] Una limitación de los modelos de rendimiento es que:", "options": ["Demuestran relaciones causales", "Sirven para todos los deportes por igual", "Simplifican una realidad multifactorial, se basan en correlaciones y no recogen la variabilidad individual", "Incluyen demasiados factores psicológicos"], "key": "c", "explanation": "Además son específicos de cada deporte y no incluyen bien factores tácticos, técnicos ni ambientales.", "tag": "CLAVE"}, {"id": "5.48", "tema": 5, "q": "[CLAVE] En el modelo de rendimiento de Wilmore y Costill, ¿cuál es un componente MORFOLÓGICO?", "options": ["La velocidad de competición", "La economía de movimiento", "La densidad capilar muscular", "El VO₂máx"], "key": "c", "explanation": "Morfológicos: densidad capilar, VS, enzimas aeróbicas, % fibras I. Funcionales: VO₂máx, VO₂ en el umbral, economía, eficiencia.", "tag": "CLAVE"}, {"id": "5.49", "tema": 5, "q": "Un fondista corre 5000 m a 3′32″/km (212 s/km). Al 75 % de su velocidad, su ritmo es:", "options": ["≈ 5′30″/km", "≈ 2′39″/km", "≈ 4′25″/km", "≈ 4′43″/km"], "key": "d", "explanation": "212 ÷ 0,75 = 282,7 s/km. Ojo: no es 212 × 1,25 (velocidad y tiempo son inversos).", "tag": ""}, {"id": "5.50", "tema": 5, "q": "Una persona toma betabloqueantes (FCmáx 208 y FC reposo 68 medidas con el fármaco). Al 65 % por Karvonen, su FC de entrenamiento es:", "options": ["91 lpm", "176 lpm", "159 lpm", "135 lpm"], "key": "c", "explanation": "(208 − 68) × 0,65 + 68 = 91 + 68 = 159. Karvonen sigue siendo válido con las FC medidas con el fármaco.", "tag": ""}, {"id": "6.1", "tema": 6, "q": "[CLAVE] Los respondedores y no respondedores son:", "options": ["Atletas que toman o no suplementos", "Deportistas que responden o no a un cuestionario", "Personas que, ante el mismo estímulo de entrenamiento, mejoran mucho (high responders) o poco o nada (low/non-responders)", "Personas con o sin lesiones"], "key": "c", "explanation": "Según la diapositiva, la magnitud de los cambios depende principalmente de los antecedentes genéticos.", "tag": "CLAVE"}, {"id": "6.2", "tema": 6, "q": "[CLAVE] Que existan no respondedores implica que:", "options": ["Basta con aumentar el volumen", "Todos responden igual", "Hay que evaluar e individualizar el entrenamiento; un no respondedor en VO₂máx puede responder en umbrales, economía o fuerza", "El entrenamiento no sirve"], "key": "c", "explanation": "Respuesta razonada a partir del HERITAGE (0-43 % de mejora).", "tag": "CLAVE"}, {"id": "6.3", "tema": 6, "q": "Según el principio de especificidad, el entrenamiento anaeróbico provoca sobre todo:", "options": ["Más oxidación de grasa", "Aumento de la fuerza y de la resistencia a la acidosis metabólica", "Más mitocondrias", "Aumento de la densidad capilar"], "key": "b", "explanation": "El aeróbico provoca mejoras ligadas al O₂: más flujo y más capacidad de producir ATP oxidativo.", "tag": ""}, {"id": "6.4", "tema": 6, "q": "El «techo de volumen» significa que:", "options": ["A partir de cierto volumen, entrenar más no mejora la resistencia ni el VO₂máx", "El volumen no influye nunca", "Cuanto más volumen, más mejora siempre", "El volumen máximo es de 10 h/semana"], "key": "a", "explanation": "Por eso quien incluye trabajo interválico de alta intensidad mejora más que quien solo hace trabajo largo y lento.", "tag": ""}, {"id": "6.5", "tema": 6, "q": "El entrenamiento interválico se caracteriza por:", "options": ["Una sola serie larga", "Pausas completas de 10 min", "Ejercicio sin descanso", "Repeticiones rápidas y breves con descansos breves e incompletos"], "key": "d", "explanation": "El continuo es sin descanso.", "tag": ""}, {"id": "6.6", "tema": 6, "q": "Con el entrenamiento aeróbico, la mioglobina muscular:", "options": ["Disminuye", "Aumenta un 75-80 %", "Aumenta un 5 %", "No cambia"], "key": "b", "explanation": "Más mioglobina → el músculo almacena y transporta más O₂.", "tag": ""}, {"id": "6.7", "tema": 6, "q": "Con el entrenamiento aeróbico, las fibras musculares:", "options": ["Aumentan la sección de las ST (tipo I) y hay una leve transformación de IIx en IIa", "Se transforman todas en IIx", "Pierden capilares", "Aumentan las IIx"], "key": "a", "explanation": "Algunas IIa pueden incluso pasar a ST.", "tag": ""}, {"id": "6.8", "tema": 6, "q": "Las enzimas del ciclo de Krebs que más cambian con el entrenamiento aeróbico son:", "options": ["Creatina quinasa y mioquinasa", "Succinato deshidrogenasa (SDH) y citrato sintasa", "Fosforilasa y hexoquinasa", "PFK y LDH"], "key": "b", "explanation": "Las enzimas oxidativas mejoran mucho más que el VO₂máx.", "tag": ""}, {"id": "6.9", "tema": 6, "q": "En 7 meses de entrenamiento aeróbico, comparando el VO₂máx y la SDH:", "options": ["La SDH no cambia", "El VO₂máx sube más que la SDH", "Ambos suben igual", "El VO₂máx sube ~25-30 % y se estanca; la SDH sigue subiendo mucho más (cientos de %)"], "key": "d", "explanation": "Las adaptaciones periféricas (enzimas) superan con mucho a la mejora del VO₂máx.", "tag": ""}, {"id": "6.10", "tema": 6, "q": "El PGC-1α es:", "options": ["Una hormona esteroidea", "Una enzima glucolítica", "Un transportador de lactato", "Un regulador activado por el entrenamiento que estimula la biogénesis mitocondrial y la mitofagia"], "key": "d", "explanation": "Envejecimiento, estrés oxidativo, hipoxia e inflamación debilitan las mitocondrias.", "tag": ""}, {"id": "6.11", "tema": 6, "q": "El Q̇O₂ muscular mide:", "options": ["La ventilación", "La capacidad respiratoria/oxidativa máxima del músculo (en una biopsia)", "El VO₂máx de todo el cuerpo", "El gasto cardíaco"], "key": "b", "explanation": "El VO₂máx es la absorción máxima de O₂ de todo el cuerpo.", "tag": ""}, {"id": "6.12", "tema": 6, "q": "Con el entrenamiento aeróbico, los depósitos musculares de glucógeno y triglicéridos:", "options": ["Solo aumenta el glucógeno hepático", "Aumentan, y se oxida más grasa, lo que ahorra glucógeno", "No cambian", "Disminuyen"], "key": "b", "explanation": "Los AGL se movilizan más y están más accesibles.", "tag": ""}, {"id": "6.13", "tema": 6, "q": "[CLAVE] El VO₂máx mejora con el entrenamiento aeróbico por factores centrales y periféricos. ¿Cuál es PERIFÉRICO?", "options": ["Más volumen plasmático", "Más gasto cardíaco máximo", "Más volumen sistólico", "Más capilares, mioglobina, mitocondrias y enzimas oxidativas, que aumentan la dif. a-vO₂"], "key": "d", "explanation": "Fick: VO₂ = Q × dif. a-vO₂. Centrales (Tema 5): VS, Q, volumen plasmático. Periféricos: extracción de O₂.", "tag": "CLAVE"}, {"id": "6.14", "tema": 6, "q": "[CLAVE] ¿Por qué el entrenamiento anaeróbico (HIIT, sprints de 30 s) también puede mejorar el VO₂?", "options": ["No puede mejorarlo en ningún caso", "Porque reduce la mioglobina", "Porque produce adaptaciones oxidativas (la COX sube igual que con el continuo moderado) y mejora la capacidad oxidativa del músculo", "Porque aumenta la FC máxima"], "key": "c", "explanation": "Los sprints muy cortos (≈6 s) apenas cambian las enzimas oxidativas.", "tag": "CLAVE"}, {"id": "6.15", "tema": 6, "q": "[CLAVE] ¿Qué ocurre con los umbrales cuando entrenamos (resistencia)?", "options": ["Se desplazan a la derecha: aparecen a mayor intensidad absoluta y a mayor % del VO₂máx", "Desaparecen", "No cambian", "Se desplazan a la izquierda"], "key": "a", "explanation": "A la misma carga submáxima hay menos lactato.", "tag": "CLAVE"}, {"id": "6.16", "tema": 6, "q": "[CLAVE] A la misma carga submáxima, el entrenado tiene menos lactato porque:", "options": ["Tiene más fibras IIx", "Tiene más mitocondrias y enzimas oxidativas, oxida más grasa, tiene más capilares y aclara mejor el lactato", "Ventila menos", "Produce menos ATP"], "key": "b", "explanation": "El piruvato entra en la mitocondria en lugar de convertirse en lactato.", "tag": "CLAVE"}, {"id": "6.17", "tema": 6, "q": "[CLAVE] ¿Puede el entrenamiento de fuerza máxima mejorar el rendimiento en deportes de resistencia?", "options": ["Sí, mejorando la economía/eficiencia, retrasando la fatiga y mejorando el sprint final, sin mermar la resistencia", "No, siempre la empeora", "Sí, porque aumenta mucho el VO₂máx", "Solo en mujeres"], "key": "a", "explanation": "Cada zancada supone un % menor de la fuerza máxima → menos fibras rápidas reclutadas.", "tag": "CLAVE"}, {"id": "6.18", "tema": 6, "q": "[CLAVE] El entrenamiento de fuerza desplaza los tipos de fibra:", "options": ["De IIa hacia IIx", "De IIx hacia IIa", "De I hacia IIx", "No los modifica"], "key": "b", "explanation": "La resistencia desplaza de IIx hacia I; la inmovilización o desnervación, hacia IIx. Las IIa son más oxidativas que las IIx.", "tag": "CLAVE"}, {"id": "6.19", "tema": 6, "q": "[CLAVE] El test de Wingate es:", "options": ["Una prueba anaeróbica de 30 s a máxima intensidad en cicloergómetro contra una carga proporcional al peso", "Una prueba incremental hasta el VO₂máx", "Un test de umbrales con lactato", "Una prueba de 12 min de carrera"], "key": "a", "explanation": "Carga típica ≈ 7,5 % del peso corporal (0,075 kg/kg en Monark).", "tag": "CLAVE"}, {"id": "6.20", "tema": 6, "q": "[CLAVE] En el Wingate, la potencia pico (PP) refleja sobre todo:", "options": ["La capacidad aeróbica", "El VO₂máx", "La potencia anaeróbica aláctica (primeros segundos)", "El umbral anaeróbico"], "key": "c", "explanation": "La potencia media (MP) refleja la capacidad anaeróbica láctica.", "tag": "CLAVE"}, {"id": "6.21", "tema": 6, "q": "[CLAVE] En un Wingate, la potencia máxima es 1000 W y la mínima 600 W. El índice de fatiga es:", "options": ["400 %", "166 %", "40 %", "60 %"], "key": "c", "explanation": "(Pmáx − Pmín) ÷ Pmáx × 100 = 400 ÷ 1000 × 100 = 40 %.", "tag": "CLAVE"}, {"id": "6.22", "tema": 6, "q": "Con el entrenamiento anaeróbico, el sistema ATP-PCr:", "options": ["Multiplica por 3 la creatina quinasa", "Cambia poco a nivel enzimático; el rendimiento mejora sobre todo por la fuerza", "Se vuelve aeróbico", "Desaparece"], "key": "b", "explanation": "CK y mioquinasa apenas cambian con sprints de 6 s y suben ≈12-14 % con sprints de 30 s.", "tag": ""}, {"id": "6.23", "tema": 6, "q": "Las enzimas glucolíticas que aumentan con el entrenamiento anaeróbico son:", "options": ["SDH y citrato sintasa", "Carnitina palmitil transferasa", "Citocromo oxidasa y malato deshidrogenasa", "Fosforilasa, PFK, LDH y hexoquinasa"], "key": "d", "explanation": "Pero las ganancias de rendimiento se deben más a la fuerza que a las enzimas.", "tag": ""}, {"id": "6.24", "tema": 6, "q": "Según la tabla 11.5, el entrenamiento aeróbico aumenta la SDH de 8,1 a 20,8. El porcentaje de cambio es:", "options": ["+257 %", "+61 %", "+157 %", "+12,7 %"], "key": "c", "explanation": "Ec. 9: (20,8 − 8,1) ÷ 8,1 × 100 = +157 %.", "tag": ""}, {"id": "6.25", "tema": 6, "q": "Según la tabla 11.5, la fosforilasa en entrenados aeróbicos respecto a no entrenados:", "options": ["Sube mucho", "Se duplica", "No cambia", "Baja (de 5,3 a 3,7)"], "key": "d", "explanation": "Especificidad: cada entrenamiento adapta su sistema.", "tag": ""}, {"id": "6.26", "tema": 6, "q": "[CLAVE] La densidad capilar es:", "options": ["El número de capilares por unidad de superficie de músculo (capilares/mm²) o por fibra", "El número de glóbulos rojos por mL", "La cantidad de sangre por latido", "El grosor de la pared capilar"], "key": "a", "explanation": "El entrenamiento aeróbico la aumenta.", "tag": "CLAVE"}, {"id": "6.27", "tema": 6, "q": "[CLAVE] Un aumento de la densidad capilar mejora el rendimiento aeróbico porque:", "options": ["Aumenta el hematocrito", "Aumenta la FC máxima", "Aumenta la superficie de intercambio y el tiempo de tránsito, lo que sube la dif. a-vO₂", "Reduce el gasto cardíaco"], "key": "c", "explanation": "Mejor aporte de O₂ y nutrientes y mejor retirada de CO₂, calor y lactato.", "tag": "CLAVE"}, {"id": "6.28", "tema": 6, "q": "La inactividad produce en el músculo:", "options": ["Atrofia: fibras más pequeñas y angulosas", "Más capilares", "Hipertrofia", "Más mitocondrias"], "key": "a", "explanation": "Se observa con tinciones hematoxilina-eosina, NADH y ATPasa.", "tag": ""}, {"id": "6.29", "tema": 6, "q": "El principal tampón extracelular es:", "options": ["La hemoglobina", "El fosfato", "El bicarbonato", "La creatina"], "key": "c", "explanation": "H⁺ + HCO₃⁻ ⇄ H₂CO₃ ⇄ CO₂ + H₂O.", "tag": ""}, {"id": "6.30", "tema": 6, "q": "El pH muscular en reposo es de ______ y durante el ejercicio intenso baja a ______:", "options": ["7,4 / 7,3", "7,1-7,4 / 6,6-6,9", "6,0 / 5,0", "8,0 / 7,4"], "key": "b", "explanation": "Tras un 400 m: pH muscular 6,64, pH sanguíneo 7,10.", "tag": ""}, {"id": "6.31", "tema": 6, "q": "La capacidad taponadora (buffer) mejora sobre todo con:", "options": ["El entrenamiento anaeróbico", "La dieta rica en grasa", "El entrenamiento aeróbico de baja intensidad", "El reposo"], "key": "a", "explanation": "Permite al velocista generar energía más tiempo antes de que la fatiga metabólica limite la contracción.", "tag": ""}, {"id": "6.32", "tema": 6, "q": "En el estudio de Zabala y cols. (2011) con ciclistas de BMX, el bicarbonato sódico:", "options": ["Aumentó el índice de fatiga", "Mejoró la potencia pico un 20 %", "Empeoró el rendimiento", "No mejoró el rendimiento en 3 Wingate seguidos, aunque sí alcalinizó la sangre"], "key": "d", "explanation": "No fue ergogénico en sprints consecutivos; queda abierta la pregunta en competición.", "tag": ""}, {"id": "6.33", "tema": 6, "q": "Tras sprints agotadores, el lactato se elimina más rápido con:", "options": ["Recuperación pasiva", "Recuperación activa", "Hiperventilación voluntaria", "Ayuno"], "key": "b", "explanation": "Figura 8.18.", "tag": ""}, {"id": "6.34", "tema": 6, "q": "Respecto al sistema nervioso, el sistema endocrino es:", "options": ["Una comunicación química, más lenta pero más duradera", "Más rápido y menos duradero", "Una comunicación eléctrica y rápida", "Independiente de la homeostasis"], "key": "a", "explanation": "Glándulas → hormonas → células diana.", "tag": ""}, {"id": "6.35", "tema": 6, "q": "Las hormonas esteroideas:", "options": ["Son, por ejemplo, la insulina y la GH", "Derivan de aminoácidos", "No atraviesan la membrana y usan AMPc", "Son liposolubles, atraviesan la membrana y actúan sobre receptores internos activando genes"], "key": "d", "explanation": "Esteroideas: cortisol, aldosterona, testosterona, estrógenos. Las no esteroideas usan receptor de membrana y segundo mensajero.", "tag": ""}, {"id": "6.36", "tema": 6, "q": "¿Cuál de estas hormonas es NO esteroidea?", "options": ["Cortisol", "Testosterona", "Aldosterona", "Adrenalina"], "key": "d", "explanation": "Las catecolaminas, la insulina, la GH y las tiroideas son no esteroideas.", "tag": ""}, {"id": "6.37", "tema": 6, "q": "Cuando hay mucha hormona en sangre, la célula reduce sus receptores. Esto se llama:", "options": ["Segundo mensajero", "Up-regulation", "Retroalimentación positiva", "Down-regulation (desensibilización)"], "key": "d", "explanation": "Ejemplo: quien entrena tiene menos insulina basal y el músculo aumenta sus receptores (up- regulation) → más sensibilidad.", "tag": ""}, {"id": "6.38", "tema": 6, "q": "[CLAVE] La regla general del efecto del entrenamiento sobre las hormonas es que, a la misma carga absoluta:", "options": ["Se invierte", "No hay respuesta", "La respuesta es mayor", "La respuesta hormonal es atenuada (cambian menos)"], "key": "d", "explanation": "Esa carga supone menos estrés relativo. Excepciones: cortisol algo más alto, T₃/T₄ más recambio, testosterona de reposo más baja en corredores.", "tag": "CLAVE"}, {"id": "6.39", "tema": 6, "q": "[CLAVE] La hormona del crecimiento (GH):", "options": ["Es esteroidea, de la corteza suprarrenal", "Es peptídica, de la hipófisis anterior; favorece la síntesis proteica, moviliza AGL y ahorra glucosa", "Baja durante el ejercicio", "Es hipoglucemiante"], "key": "b", "explanation": "Sube con la intensidad; con el entrenamiento, respuesta atenuada a la misma carga.", "tag": "CLAVE"}, {"id": "6.40", "tema": 6, "q": "[CLAVE] La adrenalina:", "options": ["Baja con la intensidad", "Es una catecolamina de la médula suprarrenal; ↑ glucogenólisis, lipólisis, FC y contractilidad", "Favorece el almacén de glucógeno", "Es un esteroide de la corteza suprarrenal"], "key": "b", "explanation": "Sube a partir del ≈75 % del VO₂máx (la noradrenalina desde ≈50 %).", "tag": "CLAVE"}, {"id": "6.41", "tema": 6, "q": "[CLAVE] El cortisol:", "options": ["Solo actúa en reposo", "Es una hormona peptídica del páncreas", "Disminuye la glucemia", "Es un glucocorticoide de la corteza suprarrenal: catabolismo proteico para la gluconeogénesis, moviliza AGL y es antiinflamatorio"], "key": "d", "explanation": "Solo sube a intensidades altas, con pico a los 30-45 min; en entrenados, valores algo más altos.", "tag": "CLAVE"}, {"id": "6.42", "tema": 6, "q": "[CLAVE] La insulina:", "options": ["Es hiperglucemiante", "Sube durante el ejercicio", "Es esteroidea", "Es peptídica, de las células β del páncreas; permite la captación de glucosa y favorece el almacén"], "key": "d", "explanation": "Baja durante el ejercicio; el entrenamiento sube la sensibilidad (más receptores) y atenúa su caída.", "tag": "CLAVE"}, {"id": "6.43", "tema": 6, "q": "[CLAVE] La testosterona:", "options": ["Es una hormona peptídica de la hipófisis", "Sube mucho en reposo en corredores de fondo", "Regula el agua corporal", "Es un andrógeno esteroideo de los testículos que ↑ síntesis proteica, masa muscular y fuerza"], "key": "d", "explanation": "Pequeño ↑ con el ejercicio agudo; niveles de reposo más bajos en corredores varones.", "tag": "CLAVE"}, {"id": "6.44", "tema": 6, "q": "Las 4 hormonas que suben la glucemia durante el ejercicio son:", "options": ["Testosterona, estrógenos, insulina y ADH", "Insulina, GH, ADH y EPO", "Aldosterona, renina, insulina y T₄", "Glucagón, adrenalina, noradrenalina y cortisol"], "key": "d", "explanation": "La insulina es la única hipoglucemiante; baja durante el ejercicio.", "tag": ""}, {"id": "6.45", "tema": 6, "q": "La lipasa sensible a hormonas se activa por:", "options": ["Cortisol, adrenalina, noradrenalina, GH y la bajada de insulina", "La ADH y la aldosterona", "La EPO", "Solo la insulina"], "key": "a", "explanation": "Cortisol con pico de movilización de AGL a los 30-45 min; después siguen catecolaminas y GH.", "tag": ""}, {"id": "6.46", "tema": 6, "q": "Al aumentar la intensidad del ejercicio:", "options": ["Suben las catecolaminas y la glucogenólisis; el glucógeno muscular se usa antes que el hepático", "Baja el glucagón", "Se usa solo grasa", "Sube la insulina"], "key": "a", "explanation": "Al aumentar la duración se usa más glucógeno hepático y sube el glucagón.", "tag": ""}, {"id": "6.47", "tema": 6, "q": "La ADH (vasopresina) actúa en el ejercicio:", "options": ["Subiendo la glucemia", "Aumentando la reabsorción de agua en el riñón ante la hemoconcentración", "Estimulando la producción de glóbulos rojos", "Aumentando la excreción de agua"], "key": "b", "explanation": "Se produce en el hipotálamo y se libera desde la hipófisis posterior; responde al ↑ de osmolalidad.", "tag": ""}, {"id": "6.48", "tema": 6, "q": "La aldosterona:", "options": ["Es una hormona de la hipófisis", "Retiene Na⁺ (y agua por ósmosis) y aumenta la excreción de K⁺", "Retiene K⁺", "Baja la presión arterial"], "key": "b", "explanation": "Mineralocorticoide de la corteza suprarrenal. Forma parte del sistema renina-angiotensina- aldosterona.", "tag": ""}, {"id": "6.49", "tema": 6, "q": "La EPO se libera en el riñón ante:", "options": ["El exceso de glucosa", "La subida de la presión arterial", "El bajo contenido de O₂ en sangre, y aumenta la producción de glóbulos rojos", "La bajada del cortisol"], "key": "c", "explanation": "Clave en la adaptación al entrenamiento y a la altitud.", "tag": ""}, {"id": "6.50", "tema": 6, "q": "Los efectos de la ADH y la aldosterona tras el ejercicio duran 12-48 h y provocan:", "options": ["Deshidratación", "Aumento del hematocrito", "Una expansión del volumen plasmático (relacionada con la pseudoanemia)", "Pérdida de sodio"], "key": "c", "explanation": "Se retiene Na⁺ y el agua lo sigue.", "tag": ""}];
const STORE='fisiologia_265_pdf_v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){}
let picks=saved.picks||{},marked=saved.marked||{},i=Number(saved.i)||0,mode=saved.mode||'study',finished=!!saved.finished;
const $=id=>document.getElementById(id), letters=['a','b','c','d'];
function persist(){localStorage.setItem(STORE,JSON.stringify({picks,marked,i,mode,finished}))}
function shown(q){return finished||mode==='study'&&picks[q.id]!==undefined}
function filtered(){return BANK.map((q,n)=>({q,n})).filter(({q})=>{let f=$('filter').value;return f==='all'||f==='wrong'&&(picks[q.id]!==undefined&&letters[picks[q.id]]!==q.key)||f==='marked'&&marked[q.id]||f==='unanswered'&&picks[q.id]===undefined||f==='critical'&&q.tag==='ELIMINATORIO'})}
function render(){i=Math.max(0,Math.min(BANK.length-1,i));let q=BANK[i],sel=picks[q.id],show=shown(q),total=Object.keys(picks).length,correct=BANK.filter(x=>picks[x.id]!==undefined&&letters[picks[x.id]]===x.key).length;
$('mode').value=mode;$('counter').textContent=`Pregunta ${i+1} de ${BANK.length}`;$('done').textContent=`Respondidas: ${total}/${BANK.length}`;$('score').textContent=`Aciertos: ${correct}`;$('bar').style.width=(total/BANK.length*100)+'%';$('eyebrow').textContent=`Pregunta original ${q.id} · Tema ${q.tema}`;$('eyebrow').innerHTML+=q.tag?` <span class="tag ${q.tag==='ELIMINATORIO'?'red':''}">${q.tag}</span>`:'';
$('question').textContent=q.q.replace(/^\[(CLAVE|ELIMINATORIO)\]\s*/,'');$('answers').replaceChildren();q.options.forEach((op,k)=>{let b=document.createElement('button');b.className='answer';let strong=document.createElement('b');strong.textContent=letters[k].toUpperCase()+')';let span=document.createElement('span');span.textContent=op;b.append(strong,span);if(show&&letters[k]===q.key)b.classList.add('right');if(show&&sel===k&&letters[k]!==q.key)b.classList.add('wrong');b.disabled=finished||sel!==undefined;b.onclick=()=>{if(picks[q.id]!==undefined||finished)return;picks[q.id]=k;persist();render()};$('answers').append(b)});
let f=$('feedback');f.className='feedback hidden';if(show){let good=sel!==undefined&&letters[sel]===q.key;f.className='feedback '+(good?'good':'bad');f.textContent='';let title=document.createElement('strong');title.textContent=sel===undefined?'Respuesta correcta: '+q.key.toUpperCase():good?'✓ ¡Correcto!':'✗ Incorrecto. Respuesta correcta: '+q.key.toUpperCase();let expl=document.createElement('p');expl.textContent=q.explanation;f.append(title,expl)}
$('prev').disabled=i===0;$('next').disabled=i===BANK.length-1;$('fav').textContent=marked[q.id]?'★ Quitar marcador':'☆ Marcar para repasar';$('finish').textContent=finished?'Examen corregido':'Finalizar y corregir';$('navSummary').textContent=`${filtered().length} preguntas en esta vista`;
let grid=$('grid');grid.replaceChildren();for(let {q:x,n} of filtered()){let b=document.createElement('button');b.className='cell';if(n===i)b.classList.add('current');if(picks[x.id]!==undefined)b.classList.add(letters[picks[x.id]]===x.key?'ok':'no');else if(marked[x.id])b.classList.add('marked');b.textContent=n+1;b.title='Pregunta '+x.id;b.onclick=()=>{i=n;persist();render();window.scrollTo({top:0,behavior:'smooth'})};grid.append(b)} }
$('next').onclick=()=>{i++;persist();render()};$('prev').onclick=()=>{i--;persist();render()};$('fav').onclick=()=>{marked[BANK[i].id]=!marked[BANK[i].id];persist();render()};$('filter').onchange=render;
$('mode').onchange=e=>{if(Object.keys(picks).length&&!confirm('Cambiar de modo conserva tus respuestas. ¿Continuar?')){render();return}mode=e.target.value;finished=false;persist();render()};
$('finish').onclick=()=>{if(!finished&&!confirm('¿Finalizar y mostrar las soluciones de todas las preguntas?'))return;finished=true;persist();render()};
$('reset').onclick=()=>{if(!confirm('¿Borrar todas las respuestas y empezar de nuevo? Se conservarán los marcadores.'))return;picks={};i=0;finished=false;persist();render()};render();
</script></body></html>
