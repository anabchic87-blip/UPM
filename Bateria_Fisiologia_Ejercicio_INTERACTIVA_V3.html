const STORAGE="fisio-v3-progress";
let persisted=JSON.parse(localStorage.getItem(STORAGE)||'{"favorites":[],"failed":[],"history":{}}');
let pool=[],index=0,answers={},searchTerm="",sessionType="normal",examFinished=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function qid(q){return String(q.n)}
function save(){localStorage.setItem(STORAGE,JSON.stringify(persisted))}
function isFav(q){return persisted.favorites.includes(qid(q))}
function toggleFav(q){let id=qid(q);persisted.favorites=isFav(q)?persisted.favorites.filter(x=>x!==id):[...persisted.favorites,id];save();render()}
function buildPool(kind="normal"){
  sessionType=kind;examFinished=false;answers={};index=0;
  let base=BANK.map((q,i)=>({...q,_bankIndex:i}));
  const topic=$("#topic").value;
  if(topic!=="all")base=base.filter(q=>q.topic===topic);
  if(kind==="fails")base=base.filter(q=>persisted.failed.includes(qid(q)));
  if(kind==="favs")base=base.filter(q=>persisted.favorites.includes(qid(q)));
  let size=$("#size").value;
  if(size!=="all")base=shuffle(base).slice(0,Math.min(+size,base.length));
  else if(kind==="normal")base=shuffle(base);
  pool=base;
  render();
}
function filtered(){
  if(!searchTerm)return pool;
  let t=searchTerm.toLowerCase();
  return pool.filter(q=>q.q.toLowerCase().includes(t)||q.options.some(o=>o.text.toLowerCase().includes(t)));
}
function grade(q,selected){
  let a=[...selected].sort((x,y)=>x-y),b=[...q.correct].sort((x,y)=>x-y);
  return JSON.stringify(a)===JSON.stringify(b);
}
function updatePersisted(q,good){
  let id=qid(q);
  persisted.history[id]=(persisted.history[id]||0)+1;
  if(good) persisted.failed=persisted.failed.filter(x=>x!==id);
  else if(!persisted.failed.includes(id)) persisted.failed.push(id);
  save();
}
function stats(list){
  let good=0,bad=0,done=0;
  Object.values(answers).forEach(a=>{if(a.graded){done++;a.good?good++:bad++}});
  $("#score").textContent=good;$("#fails").textContent=bad;$("#pct").textContent=done?Math.round(good/done*100)+"%":"0%";
  $("#bar").style.width=(pool.length?done/pool.length*100:0)+"%";
  $("#pos").textContent=list.length?Math.min(index+1,list.length):0;
  $("#sessionInfo").innerHTML=`${$("#studyMode").value==="study"?"Modo estudio":"Modo examen"} · ${pool.length} preguntas<br>${sessionType==="fails"?"Repaso de fallos":sessionType==="favs"?"Favoritas":"Selección actual"}`;
}
function renderGrid(list){
  $("#qgrid").innerHTML=list.map((q,i)=>{
    let a=answers[qid(q)],cls="qdot";
    if(a?.graded)cls+=a.good?" good":" bad";
    if(i===index)cls+=" current";
    if(isFav(q))cls+=" faved";
    return `<button class="${cls}" data-i="${i}">${i+1}</button>`;
  }).join("");
  document.querySelectorAll(".qdot").forEach(b=>b.onclick=()=>{index=+b.dataset.i;render()});
}
function resultScreen(){
  let total=pool.length,good=Object.values(answers).filter(a=>a.graded&&a.good).length,bad=Object.values(answers).filter(a=>a.graded&&!a.good).length,blank=total-good-bad;
  let pct=total?Math.round(good/total*100):0,note=(good/Math.max(total,1)*10).toFixed(1);
  $("#quiz").innerHTML=`<div class="examSummary"><div class="small">EXAMEN FINALIZADO</div><div class="bigscore">${note}/10</div><h2>${pct}% de aciertos</h2><div class="summarygrid"><div><b>${good}</b><br>Aciertos</div><div><b>${bad}</b><br>Fallos</div><div><b>${blank}</b><br>Sin responder</div></div><button class="btn" id="reviewExam">Revisar respuestas</button></div>`;
  $("#reviewExam").onclick=()=>{examFinished=false;index=0;render()};
}
function render(){
  const list=filtered(); if(index>=list.length)index=Math.max(0,list.length-1); stats(list);renderGrid(list);
  if($("#studyMode").value==="exam" && examFinished){resultScreen();return}
  if(!list.length){$("#quiz").innerHTML='<div class="card"><h3>No hay preguntas en esta selección.</h3><p>Prueba otro tema o inicia un test nuevo.</p></div>';return}
  const q=list[index],id=qid(q),saved=answers[id],mode=$("#studyMode").value,multi=q.correct.length>1;
  const reveal = mode==="study" ? saved?.graded : examFinished;
  let opts=q.options.map((o,i)=>({...o,orig:i}));
  let oh=opts.map(o=>{
    let cls="option";
    if(reveal){
      if(q.correct.includes(o.orig))cls+=" correct";
      else if(saved?.selected?.includes(o.orig))cls+=" wrong";
      else cls+=" dim";
    }
    const checked=saved?.selected?.includes(o.orig)?"checked":"";
    if(multi && !reveal) return `<label class="${cls}"><input type="checkbox" class="multi" value="${o.orig}" ${checked} style="margin-top:5px"><span class="letter">${esc(o.label)}</span><span>${esc(o.text)}</span></label>`;
    return `<button class="${cls}" data-i="${o.orig}" ${reveal?'disabled':''}><span class="letter">${esc(o.label)}</span><span>${esc(o.text)}</span></button>`;
  }).join("");
  let feedback="";
  if(mode==="study" && saved?.graded) feedback=`<div class="feedback ${saved.good?'ok':'bad'}">${saved.good?'✓ CORRECTA':'✗ FALSA'}</div>`;
  let exp="";
  if(mode==="study" && saved?.graded){
    const src=q.source.supported
      ? `<div class="sourcebox"><strong>📚 Dónde está en los apuntes:</strong><br>${esc(q.source.source)} · página ${q.source.page}${q.source.heading?` · ${esc(q.source.heading)}`:""}<br><span class="small">Referencia ${q.source.level==="directa"?"directa":"relacionada"} con el contenido de la pregunta.</span></div>`
      : `<div class="sourcebox unsupported"><strong>⚠ Revisión manual:</strong> no he encontrado un fragmento suficientemente claro en los dos PDF para justificar esta respuesta sin añadir información externa.</div>`;
    exp=`<div class="explain study"><strong>Por qué es correcta:</strong><br>${esc(q.study_explanation)}</div>${src}`;
    if(q.correction_note) exp+=`<div class="explain correction"><strong>Corrección respecto al PDF original:</strong><br>${esc(q.correction_note)}</div>`;
  }
  const instruction=multi?`<div class="multi-note">Selecciona la/s respuesta/s correcta/s. Puede haber más de una.</div>`:`<div class="multi-note">Selecciona la respuesta correcta.</div>`;
  let check=multi&&!reveal?`<div class="checkrow"><button class="btn" id="checkMulti">${mode==="study"?"Comprobar respuesta":"Guardar respuesta"}</button></div>`:"";
  $("#quiz").innerHTML=`<article class="card"><div class="topline"><div><span class="badge">Pregunta ${q.n}</span> <span class="topic">${esc(q.topic)}</span></div><button class="fav ${isFav(q)?'on':''}" id="favBtn" title="Favorita">${isFav(q)?"★":"☆"}</button></div><p class="question">${esc(q.q)}</p>${instruction}<div>${oh}</div>${check}${feedback}${exp}</article>`;
  $("#favBtn").onclick=()=>toggleFav(q);
  if(multi&&!reveal){
    $("#checkMulti").onclick=()=>{
      let selected=[...document.querySelectorAll(".multi:checked")].map(x=>+x.value);
      if(!selected.length)return;
      let good=grade(q,selected); answers[id]={graded:true,good,selected};
      if(mode==="study")updatePersisted(q,good); render();
    };
  } else if(!reveal){
    document.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>{
      let selected=[+btn.dataset.i],good=grade(q,selected);answers[id]={graded:true,good,selected};
      if(mode==="study")updatePersisted(q,good);
      if(mode==="exam" && index<list.length-1){index++;render()} else render();
    });
  }
}
$("#newTest").onclick=()=>buildPool("normal");
$("#reviewFails").onclick=()=>buildPool("fails");
$("#reviewFavs").onclick=()=>buildPool("favs");
$("#prev").onclick=()=>{if(index>0){index--;render()}};
$("#next").onclick=()=>{
  let list=filtered();
  if($("#studyMode").value==="exam" && index===list.length-1){
    examFinished=true;
    // grade/persist all exam responses now
    for(const q of pool){let a=answers[qid(q)];if(a?.graded)updatePersisted(q,a.good)}
    render(); return;
  }
  if(index<list.length-1){index++;render()}
};
$("#search").oninput=e=>{searchTerm=e.target.value.trim();index=0;render()};
$("#studyMode").onchange=()=>buildPool(sessionType);
$("#topic").onchange=()=>buildPool("normal");
$("#clearProgress").onclick=()=>{if(confirm("¿Quieres borrar favoritas, fallos y progreso guardado?")){persisted={favorites:[],failed:[],history:{}};save();render()}};
buildPool("normal");
</script></body></html>
